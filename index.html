<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>CentLock · Earn Automatically</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <!-- Monetag Popunder Ad - Opens automatically -->
  <script type="text/javascript">
    // Monetag Direct Link - Opens popunder ad
    function showMonetagAd() {
      var adUrl = 'https://omg10.com/4/11140123';
      window.open(adUrl, '_blank');
    }
    
    // Show ad immediately on page load
    setTimeout(function() {
      showMonetagAd();
    }, 3000);
    
    // Show ad every 30 seconds
    setInterval(function() {
      showMonetagAd();
    }, 30000);
  </script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #0a0f1a; min-height: 100vh; padding: 1rem; display: flex; justify-content: center; align-items: center; }
    .container { max-width: 500px; width: 100%; background: #0f1422; border-radius: 2rem; padding: 1.5rem; border: 1px solid #4CAF50; }
    h1 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #4CAF50, #81C784); -webkit-background-clip: text; background-clip: text; color: transparent; text-align: center; }
    .balance-card { background: linear-gradient(135deg, #1a1f30, #0f1422); border-radius: 1.5rem; padding: 1.2rem; margin: 1rem 0; text-align: center; border: 1px solid #2a2f42; }
    .balance-amount { font-size: 2.8rem; font-weight: 800; color: white; }
    .progress-bar { background: #2a2f42; border-radius: 1rem; height: 8px; margin: 0.8rem 0; overflow: hidden; }
    .progress-fill { background: linear-gradient(90deg, #4CAF50, #81C784); height: 100%; width: 0%; transition: width 0.3s; }
    .stats { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .stat { background: #0f1422; flex: 1; padding: 0.5rem; border-radius: 1rem; text-align: center; }
    .stat-label { font-size: 0.6rem; color: #8aa0bc; text-transform: uppercase; }
    .stat-value { font-size: 1rem; font-weight: 700; color: white; }
    .btn { width: 100%; padding: 0.9rem; border: none; border-radius: 2rem; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin: 0.5rem 0; transition: 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #2E7D32, #4CAF50); color: white; }
    .btn-outline { background: transparent; border: 1px solid #4CAF50; color: #4CAF50; }
    .btn-danger { background: #dc2626; color: white; }
    .input-group { background: #0f1422; border-radius: 2rem; padding: 0.3rem 1.2rem; display: flex; gap: 0.5rem; margin: 0.8rem 0; border: 1px solid #2a2f42; }
    .input-group input { background: transparent; border: none; flex: 1; color: white; font-size: 0.9rem; outline: none; }
    .info-card { background: #0f3b5c30; border-left: 3px solid #4CAF50; padding: 0.8rem; border-radius: 1rem; font-size: 0.7rem; color: #C8E6C9; margin: 0.8rem 0; }
    .warning-card { background: #facc1510; border-left: 3px solid #facc15; padding: 0.8rem; border-radius: 1rem; font-size: 0.7rem; color: #fde047; margin: 0.8rem 0; }
    .ad-container { background: #1e2a3a; border-radius: 1rem; padding: 0.5rem; margin: 0.5rem 0; text-align: center; font-size: 0.7rem; color: #8aa0bc; border: 1px dashed #4CAF50; }
    .tx-list { max-height: 200px; overflow-y: auto; margin-top: 0.5rem; }
    .tx-item { background: #0f1422; padding: 0.6rem; border-radius: 1rem; margin-bottom: 0.4rem; display: flex; justify-content: space-between; font-size: 0.7rem; }
    .positive { color: #4ade80; font-weight: 600; }
    .negative { color: #f87171; }
    hr { border-color: #2a2f42; margin: 1rem 0; }
    .auto-badge { background: #4CAF50; color: #0a0f1a; padding: 0.2rem 0.5rem; border-radius: 1rem; font-size: 0.6rem; font-weight: bold; display: inline-block; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
<div class="container" id="app">
  <div style="text-align: center; padding: 2rem; color: #8aa0bc;">Loading CentLock...</div>
</div>

<script>
  // ============================================================
  // FIREBASE CONFIGURATION
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDiZsP0tcprL1xIhu-sCkGP-4Mfv_Rw9dg",
    authDomain: "joblink-d3d17.firebaseapp.com",
    projectId: "joblink-d3d17",
    storageBucket: "joblink-d3d17.firebasestorage.app",
    messagingSenderId: "462684482263",
    appId: "1:462684482263:web:981dcbe334850ca3fe5e92"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ============================================================
  // APP CONFIGURATION
  // ============================================================
  const AUTO_EARN_PER_AD = 0.001;    // $0.001 per ad view
  const MIN_WITHDRAW = 10.00;
  const AD_INTERVAL_SECONDS = 30;     // Show ad every 30 seconds

  let currentUser = null;
  let userData = null;
  let adInterval = null;
  let adViewCount = 0;

  // ============================================================
  // SHOW AD AND CREDIT USER
  // ============================================================
  async function showAdAndCredit() {
    if (!currentUser || !userData) return;
    
    // Open Monetag ad in new tab
    window.open('https://omg10.com/4/11140123', '_blank');
    
    // Credit the user
    const earnings = AUTO_EARN_PER_AD;
    const userRef = db.collection("users").doc(currentUser.uid);
    
    try {
      await db.runTransaction(async (transaction) => {
        const doc = await transaction.get(userRef);
        if (!doc.exists) return;
        
        const currentBalance = doc.data().balance || 0;
        const currentTotal = doc.data().totalEarned || 0;
        const currentRequests = doc.data().totalRequests || 0;
        
        transaction.update(userRef, {
          balance: currentBalance + earnings,
          totalEarned: currentTotal + earnings,
          totalRequests: currentRequests + 1
        });
        
        transaction.set(userRef.collection('transactions').doc(), {
          type: 'auto_ad',
          amount: earnings,
          createdAt: new Date(),
          note: '🤖 Auto ad viewed'
        });
      });
      
      const updated = await userRef.get();
      userData = updated.data();
      renderDashboard();
    } catch (error) {
      console.log("Auto credit error:", error);
    }
  }

  // Start auto ad timer
  function startAutoAds() {
    if (adInterval) clearInterval(adInterval);
    adInterval = setInterval(() => {
      if (currentUser && userData && !userData.pendingWithdrawal) {
        showAdAndCredit();
      }
    }, AD_INTERVAL_SECONDS * 1000);
  }

  function stopAutoAds() {
    if (adInterval) {
      clearInterval(adInterval);
      adInterval = null;
    }
  }

  // ============================================================
  // AUTHENTICATION
  // ============================================================
  async function signUp(email, password, username) {
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      const uid = cred.user.uid;
      await db.collection("users").doc(uid).set({
        username: username.trim(),
        email: email,
        balance: 0,
        totalEarned: 0,
        totalRequests: 0,
        createdAt: new Date(),
        pendingWithdrawal: null
      });
      alert("✅ Account created! Please login.");
      return true;
    } catch (err) {
      alert(err.message);
      return false;
    }
  }

  async function signIn(email, password) {
    try {
      await auth.signInWithEmailAndPassword(email, password);
      return true;
    } catch (err) {
      alert(err.message);
      return false;
    }
  }

  async function signOut() {
    stopAutoAds();
    await auth.signOut();
    currentUser = null;
    userData = null;
    renderAuthScreen();
  }

  // ============================================================
  // DATA LOADING
  // ============================================================
  async function loadUserData() {
    if (!currentUser) return;
    const doc = await db.collection("users").doc(currentUser.uid).get();
    if (doc.exists) {
      userData = doc.data();
    } else {
      await db.collection("users").doc(currentUser.uid).set({
        username: currentUser.email.split('@')[0],
        email: currentUser.email,
        balance: 0,
        totalEarned: 0,
        totalRequests: 0,
        createdAt: new Date(),
        pendingWithdrawal: null
      });
      userData = { balance: 0, totalEarned: 0, totalRequests: 0, username: currentUser.email.split('@')[0] };
    }
  }

  async function fetchTransactions() {
    if (!currentUser) return [];
    const snap = await db.collection("users").doc(currentUser.uid).collection("transactions")
      .orderBy("createdAt", "desc")
      .limit(20)
      .get();
    return snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  }

  // ============================================================
  // WITHDRAWAL SYSTEM
  // ============================================================
  async function requestWithdrawal() {
    if (!currentUser) return;
    const balance = userData?.balance || 0;
    if (balance < MIN_WITHDRAW) {
      alert(`Minimum withdrawal is $${MIN_WITHDRAW}. Need $${(MIN_WITHDRAW - balance).toFixed(2)} more.`);
      return;
    }
    
    const pending = await db.collection("withdrawalRequests")
      .where("userId", "==", currentUser.uid)
      .where("status", "==", "pending")
      .get();
    
    if (!pending.empty) {
      alert("You already have a pending withdrawal request.");
      return;
    }
    
    try {
      await db.collection("withdrawalRequests").add({
        userId: currentUser.uid,
        username: userData.username,
        amount: balance,
        status: "pending",
        createdAt: new Date()
      });
      
      alert(`✅ Withdrawal request for $${balance.toFixed(2)} submitted. Admin will review and pay.`);
      renderDashboard();
    } catch (err) {
      alert("Error: " + err.message);
    }
  }

  // ============================================================
  // RENDER FUNCTIONS
  // ============================================================
  async function renderDashboard() {
    if (!currentUser || !userData) return;
    
    const balance = userData.balance || 0;
    const totalEarned = userData.totalEarned || 0;
    const totalRequests = userData.totalRequests || 0;
    const progress = Math.min((balance / MIN_WITHDRAW) * 100, 100);
    const transactions = await fetchTransactions();
    
    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="flex-between">
        <h1>💰 CentLock</h1>
        <button id="logoutBtn" class="btn-outline" style="width: auto; padding: 0.3rem 1rem; margin: 0;">Logout</button>
      </div>
      <div style="font-size: 0.7rem; text-align: center; color: #8aa0bc; margin: 0.5rem 0;">👋 ${userData.username} · ${currentUser.email}</div>
      
      <div class="ad-container">
        <span class="auto-badge">🤖 AUTO ADS ACTIVE</span>
        <div style="margin-top: 0.3rem;">Ad opens every ${AD_INTERVAL_SECONDS} seconds</div>
        <div style="font-size: 0.6rem; margin-top: 0.2rem;">Earning $${AUTO_EARN_PER_AD.toFixed(4)} per ad</div>
      </div>
      
      <div class="balance-card">
        <div class="balance-amount">$${formatMoney(balance)}</div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%;"></div></div>
        <div class="stats">
          <div class="stat"><div class="stat-label">GOAL</div><div class="stat-value">$${MIN_WITHDRAW}</div></div>
          <div class="stat"><div class="stat-label">ADS SEEN</div><div class="stat-value">${totalRequests}</div></div>
          <div class="stat"><div class="stat-label">EARNED</div><div class="stat-value">$${formatMoney(totalEarned)}</div></div>
        </div>
      </div>
      
      <button id="withdrawBtn" class="btn btn-primary" ${balance < MIN_WITHDRAW ? 'disabled' : ''}>
        ${balance >= MIN_WITHDRAW ? `💰 Withdraw $${formatMoney(balance)}` : `🔒 Need $${(MIN_WITHDRAW - balance).toFixed(2)} more`}
      </button>
      
      <div class="info-card">
        🤖 <strong>How Auto Ads Work:</strong><br>
        • An ad tab opens automatically every ${AD_INTERVAL_SECONDS} seconds<br>
        • You earn $${AUTO_EARN_PER_AD.toFixed(4)} per ad<br>
        • Keep this app open to maximize earnings!<br>
        • Withdraw when you reach $${MIN_WITHDRAW}
      </div>
      
      <hr>
      <div class="flex-between">
        <span style="font-size: 0.7rem; font-weight: 600;">📜 Earnings History</span>
        <span style="font-size: 0.6rem; color: #8aa0bc;">Auto-generated</span>
      </div>
      <div class="tx-list" id="txList"></div>
    `;
    
    const txContainer = document.getElementById("txList");
    if (transactions.length === 0) {
      txContainer.innerHTML = '<div class="tx-item">✨ No earnings yet. Keep the app open!</div>';
    } else {
      txContainer.innerHTML = transactions.map(tx => `
        <div class="tx-item">
          <span>${tx.type?.toUpperCase() || ''} ${tx.note || ''}</span>
          <span class="positive">+$${Math.abs(tx.amount).toFixed(4)}</span>
        </div>
      `).join('');
    }
    
    document.getElementById("withdrawBtn")?.addEventListener("click", requestWithdrawal);
    document.getElementById("logoutBtn")?.addEventListener("click", signOut);
  }

  function renderAuthScreen() {
    const app = document.getElementById("app");
    app.innerHTML = `
      <h1>💰 CentLock</h1>
      <div class="info-card" style="margin-top: 0.5rem;">Auto ads every ${AD_INTERVAL_SECONDS} seconds! Just keep the app open.</div>
      
      <div class="balance-card">
        <div style="font-size: 1.2rem; font-weight: 700;">Welcome!</div>
        <div class="stats" style="margin-top: 0.5rem;">
          <div class="stat"><div class="stat-label">EARN</div><div class="stat-value">$${AUTO_EARN_PER_AD}/ad</div></div>
          <div class="stat"><div class="stat-label">MIN</div><div class="stat-value">$${MIN_WITHDRAW}</div></div>
        </div>
      </div>
      
      <div class="info-card">🔐 Login</div>
      <div class="input-group"><span>📧</span><input type="email" id="loginEmail" placeholder="Email"></div>
      <div class="input-group"><span>🔒</span><input type="password" id="loginPass" placeholder="Password"></div>
      <button id="loginBtn" class="btn-primary">Login</button>
      
      <hr>
      
      <div class="info-card">📝 Create Account</div>
      <div class="input-group"><span>📧</span><input type="email" id="regEmail" placeholder="Email"></div>
      <div class="input-group"><span>👤</span><input type="text" id="regUsername" placeholder="Username"></div>
      <div class="input-group"><span>🔒</span><input type="password" id="regPass" placeholder="Password (min 6)"></div>
      <button id="registerBtn" class="btn-outline">Sign Up</button>
      
      <div class="warning-card" style="margin-top: 1rem;">
        🤖 Ads open automatically every ${AD_INTERVAL_SECONDS} seconds. Keep this page open to earn!
      </div>
    `;
    
    document.getElementById("loginBtn")?.addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value;
      const pwd = document.getElementById("loginPass").value;
      if (await signIn(email, pwd)) {
        currentUser = auth.currentUser;
        await loadUserData();
        startAutoAds();
        renderDashboard();
      }
    });
    
    document.getElementById("registerBtn")?.addEventListener("click", async () => {
      const email = document.getElementById("regEmail").value;
      const username = document.getElementById("regUsername").value;
      const pwd = document.getElementById("regPass").value;
      if (pwd.length < 6) { alert("Password must be at least 6 characters"); return; }
      await signUp(email, pwd, username);
    });
  }

  function formatMoney(value) {
    return value.toFixed(2);
  }

  // ============================================================
  // AUTH STATE LISTENER
  // ============================================================
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      await loadUserData();
      startAutoAds();
      renderDashboard();
    } else {
      stopAutoAds();
      currentUser = null;
      userData = null;
      renderAuthScreen();
    }
  });
</script>
</body>
</html>
