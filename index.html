  async function watchRewardedAd() {
    if (!currentUser) return alert("Login first");
    
    // Disable button during ad
    const btn = document.getElementById('rewardedBtn');
    if (btn) btn.disabled = true;
    
    // Show ad overlay with countdown
    showAdOverlay();
    
    // Open Monetag ad (USER INITIATED - COMPLIANT)
    const adWindow = window.open('https://omg10.com/4/11140123', '_blank');
    
    // Start countdown
    let countdown = 6;
    const countdownEl = document.getElementById('adCountdown');
    const timer = setInterval(() => {
      countdown--;
      if (countdownEl) countdownEl.textContent = countdown;
      if (countdown <= 0) clearInterval(timer);
    }, 1000);
    
    // Auto-return after ad view duration
    setTimeout(async () => {
      // Close ad window if still open
      if (adWindow && !adWindow.closed) {
        adWindow.close();
      }
      
      // Focus back on app
      window.focus();
      
      // Hide overlay
      hideAdOverlay();
      
      // Award points
      await db.collection('users').doc(currentUser.uid).update({
        points: (userData?.points || 0) + AD_REWARD_POINTS,
        totalPoints: (userData?.totalPoints || 0) + AD_REWARD_POINTS,
        adsWatched: (userData?.adsWatched || 0) + 1
      });
      await loadUserData();
      renderApp();
      
      // Re-enable button
      if (btn) btn.disabled = false;
      
      showToast(`✅ +${AD_REWARD_POINTS} points! Ad watched.`, 3000);
    }, AD_VIEW_DURATION);
  }

  // SPIN WHEEL
  // ============================================================
  const spinRewards = [50, 25, 100, 10, 75, 5, 200, 0, 15, 30];
  let lastSpinTime = 0;
  const SPIN_COOLDOWN = 86400000;

  function spinWheel() {
    if (!currentUser) { alert("Login first"); return; }
    const now = Date.now();
    if (now - lastSpinTime < SPIN_COOLDOWN) {
      const hoursLeft = Math.ceil((SPIN_COOLDOWN - (now - lastSpinTime)) / 3600000);
      alert(`⏳ Come back in ${hoursLeft} hours for your free spin!`);
      return;
    }
    const result = spinRewards[Math.floor(Math.random() * spinRewards.length)];
    lastSpinTime = now;
    if (result > 0) {
      updatePoints(result, "🎡 Spin wheel reward!");
    } else {
      showToast("😅 Better luck next time!", 2000);
    }
    renderApp();
  }

  async function claimDaily() {
    if (!currentUser) return;
    const today = new Date().toISOString().split('T')[0];
    const ref = db.collection('users').doc(currentUser.uid).collection('dailyClaims').doc(today);
    if ((await ref.get()).exists) return alert("Already claimed today!");
    let streak = (userData?.streak || 0) + 1;
    let reward = DAILY_REWARD + Math.floor(streak / 7) * 5;
    if (streak >= 30) reward = 100;
    await ref.set({ date: today });
    await db.collection('users').doc(currentUser.uid).update({
      points: (userData?.points || 0) + reward,
      totalPoints: (userData?.totalPoints || 0) + reward,
      streak: streak
    });
    await loadUserData();
    showToast(`🎉 +${reward} points! ${streak} day streak!`, 3000);
    renderApp();
  }

            <div class="card" data-url="${r.url}" style="text-align:left; padding:0.5rem 1rem;">
              <span>${r.icon} ${r.name}</span>
              <span class="info">${r.category}</span>
            </div>
          `).join('');
          container.querySelectorAll('.card[data-url]').forEach(c => c.addEventListener('click', () => openUrl(c.dataset.url)));
        }
      });
      document.getElementById("searchInput")?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById("searchBtn")?.click();
      });
    }

    // Learn tab
    if (currentTab === 'learn') {
      document.querySelectorAll('.complete-lesson').forEach(btn => {
        const card = btn.closest('.lesson-card');
        if (card) btn.addEventListener('click', () => completeLesson(parseInt(card.dataset.id), parseInt(card.dataset.reward)));
      });
    }

    // Jobs tab
    if (currentTab === 'jobs') {
      document.querySelectorAll('.apply-job').forEach(b => b.addEventListener('click', () => openUrl(b.dataset.url)));
    }

    // Deals tab
    if (currentTab === 'deals') {
      document.querySelectorAll('.coupon-card').forEach(c => c.addEventListener('click', () => {
        navigator.clipboard.writeText(c.dataset.code);
        showToast(`Code "${c.dataset.code}" copied!`, 1500);
      }));
      document.querySelectorAll('.opportunity-card[data-copy]').forEach(c => c.addEventListener('click', () => {
        navigator.clipboard.writeText(c.dataset.copy);
        showToast(`USSD code "${c.dataset.copy}" copied!`, 1500);
      }));
    }

    // AI tab
    if (currentTab === 'ai') {
      document.getElementById("sendChatBtn")?.addEventListener('click', async () => {
        const input = document.getElementById('chatInput');
        const q = input.value;
        if (!q) return;
        const chat = document.getElementById('chatMessages');
        chat.innerHTML += `<div class="chat-message user-message">👤 ${q}</div>`;
        setTimeout(() => {
          chat.innerHTML += `<div class="chat-message ai-message">🤖 ${getAIResponse(q)}</div>`;
          chat.scrollTop = chat.scrollHeight;
        }, 500);
        input.value = '';
        await updatePoints(2, 'AI question');
        chat.scrollTop = chat.scrollHeight;
      });
    }

    // Finance tab
    if (currentTab === 'finance') {
      document.getElementById("addExpenseBtn")?.addEventListener('click', () => {
        const n = document.getElementById('expenseName')?.value;
        const a = document.getElementById('expenseAmount')?.value;
        const t = document.getElementById('expenseType')?.value;
        if (n && a) addExpense(n, a, t);
      });
    }

    // Notes tab
    if (currentTab === 'notes') {
      document.getElementById("saveNoteBtn")?.addEventListener('click', () => {
        const c = document.getElementById('noteContent')?.value;
        if (c) saveNote(c);
      });
    }

    // Trivia tab
    if (currentTab === 'trivia') {
      document.querySelectorAll('.card[data-opt]').forEach(c => c.addEventListener('click', async () => {
        const selected = parseInt(c.dataset.opt);
        const correct = parseInt(c.dataset.correct);
        const reward = parseInt(c.dataset.reward);
        if (selected === correct) {
          c.style.borderColor = '#4CAF50';
          c.style.background = 'rgba(76, 175, 80, 0.2)';
          await updatePoints(reward, 'Trivia correct!');
          triviaIndex++;
          if (triviaIndex >= triviaQuestions.length) {
            showToast(`🎉 Trivia complete!`, 3000);
            triviaIndex = 0;
          }
          renderApp();
        } else {
          c.style.borderColor = '#f44336';
          c.style.background = 'rgba(244, 67, 54, 0.2)';
          showToast("❌ Wrong answer!", 1500);
          setTimeout(() => renderApp(), 1000);
        }
      }));
    }

    // Profile tab
    if (currentTab === 'profile') {
      document.getElementById("logoutBtn")?.addEventListener('click', signOut);
    }
  }

  // ============================================================
  // RENDER OTHER TABS
  // ============================================================
  async function renderLearnTab() {
    return `
      <div class="section-title">📚 Learning Center (20 pts each)</div>
      ${lessons.map(l => `
        <div class="lesson-card" data-id="${l.id}" data-reward="${l.reward}">
          <div class="flex"><span><strong>${l.title}</strong></span><span class="green">${l.category}</span></div>
          <div class="info">${l.content}</div>
          ${userData?.[`lesson_${l.id}`] ? '<span class="green">✓ Completed</span>' : '<button class="btn-outline complete-lesson" style="margin-top:0.3rem; padding:0.4rem; font-size:0.8rem;">Complete & Earn →</button>'}
        </div>
      `).join('')}
    `;
  }

  async function renderJobsTab() {
    return `
      <div class="section-title">💼 Opportunities</div>
      ${jobs.map(j => `
        <div class="job-card">
          <div class="flex"><span><strong>${j.title}</strong></span><span class="green">${j.type}</span></div>
          <div class="info">🏢 ${j.company} | 📍 ${j.location} | 💰 ${j.pay}</div>
          <button class="btn-outline apply-job" data-url="${j.url}" style="margin-top:0.3rem; padding:0.4rem; font-size:0.8rem;">Apply Now →</button>
        </div>
      `).join('')}
    `;
  }

  async function renderDealsTab() {
    return `
      <div class="section-title">🎁 Coupons (Tap to copy)</div>
      ${coupons.map(c => `
        <div class="coupon-card" data-code="${c.code}">
          <div style="font-size:1.1rem;">🏷️ ${c.discount}</div>
          <div class="info">Code: <strong class="green">${c.code}</strong> | Valid: ${c.valid}</div>
        </div>
      `).join('')}
      <div class="section-title">📱 Data Plans</div>
      <div class="grid-2">
        ${dataPlans.map(d => `
          <div class="card" style="text-align:left; padding:0.5rem;">
            <strong>${d.network}</strong><br>${d.plan} - ${d.price}<br><span class="info">${d.validity}</span>
          </div>
        `).join('')}
      </div>
      <div class="section-title">🏦 USSD Codes</div>
      ${bankCodes.map(b => `
        <div class="opportunity-card" data-copy="${b.transfer}" style="cursor:pointer;">
          <div class="flex"><strong>${b.bank}</strong><span class="green">Transfer: ${b.transfer}</span></div>
          <div class="flex"><span class="info">Balance: ${b.balance}</span><span class="info">Airtime: ${b.airtime}</span></div>
        </div>
      `).join('')}
    `;
  }

  async function renderAITab() {
    return `
      <div class="section-title">🤖 AI Assistant</div>
      <div id="chatMessages" style="height:250px; overflow-y:auto; background:#0f172a; border-radius:1rem; padding:0.5rem; margin-bottom:0.5rem;">
        <div class="chat-message ai-message">🤖 Ask me about: Coding, Crypto, Freelancing, AI, Business, Finance!</div>
      </div>
      <div class="flex">
        <input type="text" id="chatInput" placeholder="Ask a question..." style="flex:3;">
        <button id="sendChatBtn" class="btn-outline" style="width:auto; padding:0.4rem 1rem;">Send</button>
      </div>
      <div class="info">💡 +2 points per question!</div>
    `;
  }

  async function renderFinanceTab() {
    const expenses = await getExpenses();
    const income = expenses.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
    const expense = expenses.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
    return `
      <div class="section-title">💰 Expense Tracker</div>
      <div class="grid-2">
        <div class="card">📈 Income<br><span class="green">₦${income}</span></div>
        <div class="card">📉 Expenses<br><span class="green">₦${expense}</span></div>
      </div>
      <div class="flex">
        <input type="text" id="expenseName" placeholder="Description" style="flex:2;">
        <input type="number" id="expenseAmount" placeholder="Amount" style="flex:1;">
        <select id="expenseType" style="flex:1;">
          <option value="income">Income</option><option value="expense">Expense</option>
        </select>
        <button id="addExpenseBtn" class="btn-outline" style="width:auto; padding:0.4rem 1rem;">Add</button>
      </div>
      <div class="section-title">📈 Crypto Prices</div>
      ${cryptoPrices.map(c => `
        <div class="expense-item" style="display:flex; justify-content:space-between; padding:0.4rem; border-bottom:1px solid #2a2f42;"><span>${c.name} (${c.symbol})</span><span>$${c.price.toLocaleString()}</span><span class="${c.change >= 0 ? 'green' : 'red'}">${c.change >= 0 ? '+' : ''}${c.change}%</span></div>
      `).join('')}
    `;
  }

  async function renderNotesTab() {
    const notes = await getNotes();
    return `
      <div class="section-title">📝 My Notes</div>
      <textarea id="noteContent" rows="3" placeholder="Write a note... (password hint, shopping list, ideas)"></textarea>
      <button id="saveNoteBtn" class="btn-outline" style="padding:0.5rem;">Save Note</button>
      ${notes.length === 0 ? '<div class="info">No notes yet. Save your first note!</div>' :
        notes.map(n => `<div class="note-item" style="background:#0f172a; border-radius:0.5rem; padding:0.5rem; margin:0.3rem 0; display:flex; justify-content:space-between;"><span>📌 ${n.content.substring(0, 50)}...</span><span class="info">${new Date(n.date.toDate()).toLocaleDateString()}</span></div>`).join('')}
    `;
  }

  async function renderNewsTab() {
    return `
      <div class="section-title">📰 Latest News</div>
      ${dailyNews.map(n => `
        <div class="opportunity-card">
          <div class="flex"><span>📌 ${n.title}</span><span class="green">${n.category}</span></div>
          <div class="info">🕐 ${n.time}</div>
        </div>
      `).join('')}
      <div class="section-title">📞 Customer Care</div>
      <div class="grid-2">
        ${customerCare.map(c => `
          <div class="card" data-number="${c.number}">
            <div style="font-size:1.3rem;">${c.icon}</div>
            <div><strong>${c.name}</strong></div>
            <div class="green">${c.number}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  async function renderTriviaTab() {
    const q = triviaQuestions[triviaIndex] || triviaQuestions[0];
    return `
      <div class="section-title">🎮 Daily Trivia</div>
      <div class="opportunity-card">
        <div style="font-weight:bold; margin-bottom:0.5rem;">${q.question}</div>
        ${q.options.map((opt, idx) => `
          <div class="card" style="text-align:center; margin:0.3rem 0; padding:0.5rem;" data-opt="${idx}" data-correct="${q.correct}" data-reward="${q.reward}">
            ${String.fromCharCode(65+idx)}. ${opt}
          </div>
        `).join('')}
      </div>
      <div class="info">🏆 +${q.reward} points per correct answer!</div>
    `;
  }

  async function renderProfileTab() {
    return `
      <div class="section-title">👤 Profile</div>
      <div class="balance" style="text-align:left;">
        <div><strong>Username:</strong> ${userData?.username || currentUser?.email?.split('@')[0]}</div>
        <div><strong>Email:</strong> ${currentUser?.email}</div>
        <div><strong>Total earned:</strong> ${userData?.totalPoints || 0} pts</div>
        <div><strong>Ads watched:</strong> ${userData?.adsWatched || 0}</div>
        <div><strong>Streak:</strong> ${userData?.streak || 0} days</div>
        <div><strong>Referrals:</strong> ${userData?.referrals || 0}</div>
        <button id="logoutBtn" class="btn-outline" style="margin-top:1rem;">Logout</button>
      </div>
      <div class="info">🔗 Referral code: <strong>${userData?.referralCode || 'NONE'}</strong></div>
    `;
  }

  // ============================================================
  // MAKE FUNCTIONS GLOBAL
  // ============================================================
  window.spinWheel = spinWheel;
  window.closeAdManually = closeAdManually;

  // ============================================================
  // AUTH STATE
  // ============================================================
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      await loadUserData();
      renderApp();
    } else {
      renderApp();
    }
  });
</script>
</body>
</html>
