  function generateReferralCode(email) {
    const prefix = email.split('@')[0].slice(0, 4).toUpperCase();
    return prefix + Math.random().toString(36).substring(2, 6).toUpperCase();
  }

  function register(email, username, password, referralCode = null) {
    if (!email?.trim()) return { success: false, message: "Email required" };

  function addTransaction(user, type, amount, note) {
    if (!user.transactions) user.transactions = [];
    user.transactions.unshift({ id: generateId(), type, amount, date: Date.now(), note });
    if (user.transactions.length > 50) user.transactions.pop();
    saveUsers();

        <div class="stats-row"><span>📊 $${currentUser.balance.toFixed(2)} / $${MIN_CASHOUT_AMOUNT}</span><span>📺 Ads: ${currentUser.totalAdsWatched || 0}</span><span>💰 Total: $${currentUser.totalEarned.toFixed(2)}</span></div>
      </div>
      <div class="ad-container"><div style="font-size:0.7rem; color:#8BC34A;">📺 WATCH ADS & EARN 10%</div><button id="watchAdBtn" class="btn btn-ad">🎬 Watch Ad → +$${USER_EARNINGS_PER_AD.toFixed(4)}</button></div>
      <button id="withdrawBtn" class="btn ${canWithdraw ? 'btn-primary' : 'btn'}" ${!canWithdraw ? 'disabled' : ''}>${canWithdraw ? `💰 Withdraw Now ($${currentUser.balance.toFixed(2)})` : `🔒 Need $${(MIN_CASHOUT_AMOUNT - currentUser.balance).toFixed(2)} more`}</button>
      <div class="info-note">📌 You earn <strong>10% of every ad</strong>. Invite friends → <strong>$0.50 bonus</strong>!</div>
      <div class="warning-note">🎯 Your code: <strong style="color:#8BC34A;">${currentUser.referralCode}</strong> — share with friends!</div>
      <hr /><div class="flex-between"><span>📜 History</span><span class="badge">10% share</span></div>
      <div class="tx-list">${(currentUser.transactions || []).slice(0, 6).map(tx => `<div class="tx-item"><span>${tx.type.toUpperCase()} ${tx.note || ''}</span><span class="positive">${tx.amount > 0 ? '+' : ''}$${Math.abs(tx.amount).toFixed(4)}</span></div>`).join('')}</div>
    `;
  }

  function renderPlatformTab(category) {
    const items = allPlatforms[category] || allPlatforms.all || [];
    return `
      <div class="platform-grid">
        ${items.map(p => `<div class="platform-card" data-url="${p.url}"><div class="platform-icon">${p.icon}</div><div class="platform-name">${p.name}</div></div>`).join('')}
      </div>
      <div class="info-note">🔗 Tap any platform to open it in your browser.</div>
    `;
  }

  function renderApp() {
    const root = document.getElementById("appRoot");
    if (!root) return;

    // Admin Panel
    if (currentUser?.isAdmin) {
      const pendingWithdrawals = adminGetPendingWithdrawals();
      root.innerHTML = `
        <div class="flex-between"><h1>👑 CentLock Admin</h1><button id="logoutBtn" class="logout-btn">Logout</button></div>
        <div class="balance-card"><div class="balance-label">💰 PENDING WITHDRAWALS</div><div class="balance-amount">${pendingWithdrawals.length}</div><div>Total: $${formatMoney(pendingWithdrawals.reduce((sum, r) => sum + r.amount, 0))}</div></div>
        <div id="withdrawalsSection"></div>
      `;
      const section = document.getElementById("withdrawalsSection");
      if (pendingWithdrawals.length === 0) section.innerHTML = '<div class="info-note">✅ No pending withdrawals.</div>';
      else {
        section.innerHTML = pendingWithdrawals.map(req => `<div class="balance-card" style="margin:0.5rem 0; padding:0.8rem;"><div><strong>${req.username}</strong> (${req.userEmail})</div><div>Amount: <span class="positive">$${req.amount.toFixed(2)}</span></div><div>📅 ${formatDate(req.requestDate)}</div><button id="approve_${req.id}" class="btn btn-success" style="margin-top:0.5rem;">✅ Approve & Pay</button></div>`).join('');
        for (const req of pendingWithdrawals) document.getElementById(`approve_${req.id}`)?.addEventListener("click", () => { adminApproveWithdrawal(req.id); renderApp(); });
      }
      document.getElementById("logoutBtn")?.addEventListener("click", () => logout());
      return;
    }

    // Login Screen
    if (!currentUser) {
      root.innerHTML = `
        <div style="text-align:center;"><h1>🌐 CentLock</h1><div class="tagline">Earn 10% of ad revenue + Access ANY website on the internet</div><div class="badge">🎁 $0.10 FREE + $0.50 per referral</div></div>
        <div class="auth-card">
          <div class="info-note">✨ Watch ads to earn money. Type any website URL to visit it.</div>
          <div class="auth-title">🔐 Login</div>
          <div class="input-group"><span>📧</span><input type="email" id="loginEmail" placeholder="Email address"></div>
          <div class="input-group"><span>🔒</span><input type="password" id="loginPassword" placeholder="Password"></div>
          <button id="loginBtn" class="btn btn-primary">Login</button><hr />
          <div class="auth-title">📝 Create Account</div>
          <div class="input-group"><span>📧</span><input type="email" id="regEmail" placeholder="Email address"></div>
          <div class="input-group"><span>👤</span><input id="regUsername" placeholder="Username"></div>
          <div class="input-group"><span>🔒</span><input type="password" id="regPassword" placeholder="Password (min 4)"></div>
          <div class="input-group"><span>🔗</span><input id="regReferral" placeholder="Referral code (optional)"></div>
          <button id="registerBtn" class="btn btn-success">Get $0.10 Free</button>
          <div class="warning-note" style="margin-top:1rem;">Demo: demo@centlock.com / demo123 | Admin: admin@centlock.com / admin123</div>
        </div>
      `;
      document.getElementById("loginBtn")?.addEventListener("click", () => { const res = login(document.getElementById("loginEmail").value, document.getElementById("loginPassword").value); if (!res.success) alert(res.message); else renderApp(); });
      document.getElementById("registerBtn")?.addEventListener("click", () => { const res = register(document.getElementById("regEmail").value, document.getElementById("regUsername").value, document.getElementById("regPassword").value, document.getElementById("regReferral").value); alert(res.message); });
      return;
    }

    // Main Dashboard
    let mainContent = "";
    if (currentTab === "earn") mainContent = renderEarnTab();
    else mainContent = renderPlatformTab(currentTab);

    root.innerHTML = `
      <div class="flex-between"><h1>🌐 CentLock</h1><button id="logoutBtn" class="logout-btn">Logout</button></div>
      <div class="tagline">${currentUser.email} · @${currentUser.username}</div>
      
      <!-- Universal URL Bar - Access ANY website -->
      <div class="url-bar">
        <input type="text" id="anyUrlInput" placeholder="Type any website URL... (e.g., google.com or youtube.com)">
        <button id="goUrlBtn">Go</button>
      </div>
      <div class="quick-urls">
        <span class="quick-tag" data-url="https://www.google.com">Google</span>
        <span class="quick-tag" data-url="https://www.youtube.com">YouTube</span>
        <span class="quick-tag" data-url="https://web.whatsapp.com">WhatsApp</span>
        <span class="quick-tag" data-url="https://web.telegram.org">Telegram</span>
        <span class="quick-tag" data-url="https://www.binance.com">Binance</span>
        <span class="quick-tag" data-url="https://chat.openai.com">ChatGPT</span>
        <span class="quick-tag" data-url="https://www.netflix.com">Netflix</span>
        <span class="quick-tag" data-url="https://www.amazon.com">Amazon</span>
      </div>
      
      ${renderTabs()}
      <div id="tabContent">${mainContent}</div>
    `;

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => { currentTab = tab.dataset.tab; renderApp(); });
    });

    // Platform cards
    document.querySelectorAll('.platform-card').forEach(card => {
      card.addEventListener('click', () => { const url = card.dataset.url; if (url) openWebsite(url); });
    });

    // Quick tags
    document.querySelectorAll('.quick-tag').forEach(tag => {
      tag.addEventListener('click', () => { const url = tag.dataset.url; if (url) openWebsite(url); });
    });

    // Go button for any URL
    document.getElementById("goUrlBtn")?.addEventListener("click", () => {
      const url = document.getElementById("anyUrlInput").value.trim();
      if (url) openWebsite(url);
      else alert("Please enter a website URL");
    });
    document.getElementById("anyUrlInput")?.addEventListener("keypress", (e) => { if (e.key === 'Enter') { const url = e.target.value.trim(); if (url) openWebsite(url); } });

    document.getElementById("watchAdBtn")?.addEventListener("click", () => watchAd());
    document.getElementById("withdrawBtn")?.addEventListener("click", () => { const result = requestWithdrawal(); alert(result.message); if (result.success) renderApp(); });
    document.getElementById("logoutBtn")?.addEventListener("click", () => logout());
  }

  function init() { loadUsers(); loadSession(); renderApp(); }
  init();
</script>
</body>
</html>
