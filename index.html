  async function requestWithdraw() {
    if (!currentUser || currentUser.isAdmin) return;
    const bal = userData?.balance || 0;

      alert(`Need $${(MIN_WITHDRAW-bal).toFixed(2)} more to withdraw. Min $${MIN_WITHDRAW}`);

    }
    const userRef = db.collection('users').doc(currentUser.uid);
    try {
      await db.runTransaction(async (t) => {
        const snap = await t.get(userRef);
        if (snap.data().pendingWithdrawal) throw new Error('Pending request exists');
        t.update(userRef, {
          pendingWithdrawal: { amount: bal, requestedAt: firebase.firestore.FieldValue.serverTimestamp(), status: 'pending' },
          balance: 0
        });
        const txRef = userRef.collection('transactions');
        t.set(txRef.doc(), {
          type: 'withdrawal_request', amount: -bal, date: firebase.firestore.FieldValue.serverTimestamp(),

    const snap = await db.collection('users').where('pendingWithdrawal.status', '==', 'pending').get();
    return snap.docs.map(d => ({ uid: d.id, ...d.data(), amount: d.data().pendingWithdrawal.amount, reqDate: d.data().pendingWithdrawal.requestedAt?.toDate() }));
  }
  async function approveWithdrawal(uid, amt) {
    await db.collection('users').doc(uid).update({ pendingWithdrawal: null });
    const txRef = db.collection('users').doc(uid).collection('transactions');
    await txRef.add({ type: 'withdrawal_paid', amount: -amt, date: firebase.firestore.FieldValue.serverTimestamp(), note: `✅ Paid $${amt.toFixed(2)}` });
    alert(`Approved $${amt.toFixed(2)}`);
    renderApp();
  }
  async function rejectWithdrawal(uid) {
    const userRef = db.collection('users').doc(uid);
    await db.runTransaction(async (t) => {
      const snap = await t.get(userRef);
      const pendingAmt = snap.data().pendingWithdrawal?.amount || 0;
      const prevBal = snap.data().balance || 0;
      t.update(userRef, { pendingWithdrawal: null, balance: prevBal + pendingAmt });
      const txRef = userRef.collection('transactions');
      t.set(txRef.doc(), { type: 'withdrawal_rejected', amount: pendingAmt, date: firebase.firestore.FieldValue.serverTimestamp(), note: `❌ Withdrawal rejected, +$${pendingAmt.toFixed(2)} returned` });
    });
    alert('Withdrawal rejected, balance restored');
    renderApp();
  }

        const email = document.getElementById('loginEmail').value;
        const pwd = document.getElementById('loginPass').value;
        await signIn(email, pwd);
      };
      document.getElementById('regBtn')?.onclick = async () => {
        const email = document.getElementById('regEmail').value;
        const user = document.getElementById('regUser').value;
        const pwd = document.getElementById('regPass').value;
        const ref = document.getElementById('regRef').value;
        if (pwd.length < 6) { alert("Password at least 6 characters"); return; }
        await signUp(email, pwd, user, ref);
      };
      return;
    }
    if (!userData) await loadUserDoc();
    if (!userData) { renderApp(); return; }

    const balance = userData.balance || 0;
    const totalEarn = userData.totalEarned || 0;
    const adsWatched = userData.totalAdsWatched || 0;
    const pendingReq = userData.pendingWithdrawal;
    const progress = Math.min((balance / MIN_WITHDRAW) * 100, 100);
    const canWithdraw = balance >= MIN_WITHDRAW && !pendingReq;
    const transactions = await fetchTransactions();

    let mainArea = '';
    if (activeTab === 'earn') {
      mainArea = `
        <div class="balance-hero">
          <div class="balance-digits">$${balance.toFixed(2)}</div>
          <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
          <div class="stats-group">
            <div class="stat-pill"><div class="stat-label">GOAL</div><div class="stat-number">$${MIN_WITHDRAW}</div></div>
            <div class="stat-pill"><div class="stat-label">ADS</div><div class="stat-number">${adsWatched}</div></div>
            <div class="stat-pill"><div class="stat-label">EARNED</div><div class="stat-number">$${totalEarn.toFixed(2)}</div></div>
          </div>
        </div>
        <button id="watchAdAction" class="btn-glow">🎬 Watch ad → +$${EARN_PER_AD.toFixed(4)}</button>
        ${pendingReq ? `<div class="info-card" style="background:#2c2a1e;">⏳ Withdrawal pending — admin pays within 7 days.</div>` : ''}
        <button id="withdrawAction" class="${canWithdraw ? 'btn-primary' : 'btn-disabled'}" ${!canWithdraw ? 'disabled' : ''}>
          ${canWithdraw ? `💰 Withdraw $${balance.toFixed(2)}` : `🔒 Need $${(MIN_WITHDRAW-balance).toFixed(2)} more`}
        </button>
        <div class="referral-block"><span>🔗 Your code</span><span class="ref-code">${userData.referralCode || 'xxxx'}</span></div>
        <div class="info-card">✨ You earn 10% of every ad. Each friend you refer gives you $0.50 bonus!</div>
      `;
    } else {
      const list = platforms[activeTab] || platforms.all;
      mainArea = `<div class="grid-3">${list.map(p => `<div class="plat-card" data-url="${p.url}"><div class="plat-icon">${p.icon}</div><div class="plat-name">${p.name}</div></div>`).join('')}</div><div class="info-card">🌐 Tap any card → instant access</div>`;
    }

    root.innerHTML = `
      <div class="header-flex"><h1>⚡ CentLock</h1><button id="logoutMain" class="logout-btn">Logout</button></div>
      <div class="user-greeting">👋 ${userData.username} · <strong>${userData.email}</strong></div>
      <div class="url-navigator"><input type="text" id="customUrl" placeholder="Type any website (google.com)"><button id="goCustom" class="go-btn">Go</button></div>
      <div class="quick-row" id="quickRow"></div>
      <div class="tab-bar" id="tabBar"></div>
      <div id="dynamicContent">${mainArea}</div>
      <hr />
      <div style="font-weight:700; margin:0.5rem 0 0.3rem;">📜 Recent activity</div>
      <div class="tx-list" id="txList"></div>
    `;

    // quick links
    const quickDiv = document.getElementById('quickRow');
    ['Google','YouTube','WhatsApp','Binance','ChatGPT','Netflix'].forEach(site => {
      const chip = document.createElement('div');
      chip.className = 'quick-chip';
      chip.innerText = site;
      chip.onclick = () => openUrl(`https://${site.toLowerCase()}.com`);
      quickDiv.appendChild(chip);
    });
    // tabs
    const tabs = ['earn','all','crypto','payments','social','earning'];
    const tabContainer = document.getElementById('tabBar');
    tabContainer.innerHTML = tabs.map(t => `<div class="tab ${activeTab===t ? 'active' : ''}" data-tab="${t}">${t==='earn'?'💰 Earn':t==='all'?'🌍 All':t==='crypto'?'💎 Crypto':t==='payments'?'💳 Payments':t==='social'?'📱 Social':'💻 Earn'}</div>`).join('');
    document.querySelectorAll('.tab').forEach(el => {
      el.addEventListener('click', (e) => { activeTab = el.dataset.tab; renderApp(); });
    });
    document.getElementById('goCustom')?.addEventListener('click', () => {
      const val = document.getElementById('customUrl').value.trim();
      if(val) openUrl(val);
    });
    document.getElementById('customUrl')?.addEventListener('keypress', (e) => { if(e.key === 'Enter') openUrl(e.target.value.trim()); });
    document.querySelectorAll('.plat-card').forEach(card => {
      card.addEventListener('click', () => { const url = card.dataset.url; if(url) openUrl(url); });
    });
    document.getElementById('watchAdAction')?.addEventListener('click', () => watchAd());
    document.getElementById('withdrawAction')?.addEventListener('click', () => requestWithdraw());
    document.getElementById('logoutMain')?.addEventListener('click', async () => { await auth.signOut(); currentUser=null; userData=null; renderApp(); });

    const txContainer = document.getElementById('txList');
    if (transactions.length) {
      txContainer.innerHTML = transactions.map(t => `<div class="tx-row"><span class="tx-label">${t.type.toUpperCase()} ${t.note || ''}</span><span class="tx-amount">${t.amount>0?'+':''}$${Math.abs(t.amount).toFixed(4)}</span></div>`).join('');
    } else txContainer.innerHTML = '<div class="tx-row">✨ Watch ads to see earnings</div>';
  }

  function init() {
    auth.onAuthStateChanged(async (user) => {
      if (user) { currentUser = user; await loadUserDoc(); }
      else { currentUser = null; userData = null; }
      renderApp();
    });
  }
  init();
</script>
</body>
</html>
