<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #0a0f1a; min-height: 100vh; padding: 1rem; display: flex; justify-content: center; align-items: center; }
    .container { max-width: 550px; width: 100%; background: #0f1422; border-radius: 2rem; padding: 1.5rem; border: 1px solid #4CAF50; }
    h1 { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #4CAF50, #81C784); -webkit-background-clip: text; background-clip: text; color: transparent; text-align: center; }
    
    .tabs { display: flex; gap: 0.3rem; margin: 1rem 0; background: #0f172a; border-radius: 2rem; padding: 0.3rem; flex-wrap: wrap; }
    .tab { flex: 1; text-align: center; padding: 0.5rem; border-radius: 2rem; cursor: pointer; font-weight: 600; font-size: 0.65rem; transition: 0.2s; color: #8aa0bc; }
    .tab.active { background: #4CAF50; color: #0a0f1a; }
    
    .section-title { font-size: 0.75rem; font-weight: 700; color: #8BC34A; margin: 0.8rem 0 0.5rem 0; border-left: 3px solid #4CAF50; padding-left: 0.5rem; }
    .balance-card { background: linear-gradient(135deg, #1a1f30, #0f1422); border-radius: 1.5rem; padding: 1rem; margin: 0.8rem 0; text-align: center; border: 1px solid #2a2f42; }
    .balance-amount { font-size: 2.2rem; font-weight: 800; color: white; }
    .progress-bar { background: #2a2f42; border-radius: 1rem; height: 6px; margin: 0.5rem 0; overflow: hidden; }
    .progress-fill { background: linear-gradient(90deg, #4CAF50, #81C784); height: 100%; width: 0%; transition: width 0.3s; }
    .stats { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .stat { background: #0f1422; flex: 1; padding: 0.3rem; border-radius: 1rem; text-align: center; }
    .stat-label { font-size: 0.5rem; color: #8aa0bc; text-transform: uppercase; }
    .stat-value { font-size: 0.85rem; font-weight: 700; color: white; }
    
    .btn { width: 100%; padding: 0.8rem; border: none; border-radius: 2rem; font-weight: 700; font-size: 0.85rem; cursor: pointer; margin: 0.5rem 0; transition: 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #2E7D32, #4CAF50); color: white; }
    .btn-outline { background: transparent; border: 1px solid #4CAF50; color: #4CAF50; }
    .btn-ad { background: #F57C00; color: white; font-weight: bold; }
    .btn-task { background: #facc15; color: #0a0f1a; font-weight: bold; }
    .btn-vip { background: linear-gradient(135deg, #FFD700, #FFA500); color: #0a0f1a; font-weight: bold; }
    
    .input-group { background: #0f1422; border-radius: 2rem; padding: 0.2rem 1rem; display: flex; gap: 0.5rem; margin: 0.6rem 0; border: 1px solid #2a2f42; }
    .input-group input { background: transparent; border: none; flex: 1; color: white; font-size: 0.85rem; outline: none; }
    .info-card { background: #0f3b5c30; border-left: 3px solid #4CAF50; padding: 0.5rem; border-radius: 0.8rem; font-size: 0.6rem; color: #C8E6C9; margin: 0.5rem 0; }
    .task-card { background: #0f172a; border-radius: 1rem; padding: 0.6rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2a2f42; }
    .offer-card, .deal-card { background: #0f172a; border-radius: 1rem; padding: 0.6rem; margin-bottom: 0.5rem; border: 1px solid #2a2f42; cursor: pointer; }
    .offer-card:active, .deal-card:active { transform: scale(0.98); background: #1e2a3a; }
    .offer-title, .deal-title { font-weight: 700; font-size: 0.7rem; color: white; }
    .offer-desc, .deal-desc { font-size: 0.6rem; color: #8aa0bc; margin-top: 0.2rem; }
    .offer-reward, .deal-reward { font-size: 0.6rem; color: #4ade80; margin-top: 0.2rem; }
    .tx-list { max-height: 120px; overflow-y: auto; margin-top: 0.5rem; }
    .tx-item { background: #0f1422; padding: 0.3rem; border-radius: 0.6rem; margin-bottom: 0.2rem; display: flex; justify-content: space-between; font-size: 0.6rem; }
    .positive { color: #4ade80; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    hr { border-color: #2a2f42; margin: 0.5rem 0; }
    .url-bar { display: flex; gap: 0.5rem; background: #0f172a; border-radius: 2rem; padding: 0.2rem 0.5rem 0.2rem 1rem; border: 1px solid #2a2f42; margin: 0.5rem 0; }
    .url-bar input { flex: 1; background: transparent; border: none; padding: 0.7rem 0; color: white; font-size: 0.85rem; outline: none; }
    .url-bar button { background: #4CAF50; border: none; border-radius: 2rem; padding: 0.4rem 1rem; color: white; font-weight: bold; cursor: pointer; }
    .platform-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin: 0.5rem 0; }
    .platform-card { background: #0f172a; border-radius: 0.8rem; padding: 0.5rem 0.2rem; text-align: center; cursor: pointer; border: 1px solid #2a2f42; transition: 0.1s; }
    .platform-card:active { transform: scale(0.96); background: #1e2a3a; }
    .platform-icon { font-size: 1.3rem; }
    .platform-name { font-size: 0.6rem; font-weight: 600; color: white; margin-top: 0.2rem; }
    .vip-badge { background: linear-gradient(135deg, #FFD700, #FFA500); color: #0a0f1a; padding: 0.2rem 0.5rem; border-radius: 1rem; font-size: 0.6rem; font-weight: bold; margin-left: 0.5rem; }
  </style>
</head>
<body>
<div class="container" id="app">
  <div style="text-align: center; padding: 2rem; color: #8aa0bc;">💰 Loading CentLock...</div>
</div>

<script>
  // ============================================================
  // FIREBASE CONFIGURATION
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDiZsP0tcprL1xIhu-sCkGP-4Mfv_Rw9dg",
    authDomain: "joblink-d3d17.firebaseapp.com",
    projectId: "joblink-d3d17",
    storageBucket: "joblink-d3d17.firebasestorage.app",
    messagingSenderId: "462684482263",
    appId: "1:462684482263:web:981dcbe334850ca3fe5e92"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ============================================================
  // CONFIGURATION
  // ============================================================
  const REWARDED_AD_POINTS = 5;
  const MAX_REWARDED_ADS_DAILY = 20;
  const DAILY_STREAK_BASE = 5;
  const POINTS_FOR_5_DOLLARS = 15000;
  const MIN_WITHDRAW_POINTS = POINTS_FOR_5_DOLLARS;
  const WITHDRAW_COOLDOWN_DAYS = 7;

  let currentUser = null;
  let userData = null;
  let todayClaimed = false;
  let rewardedAdsToday = 0;
  let currentTab = "earn";

  // ============================================================
  // OFFERS & DEALS
  // ============================================================
  const offerwallOffers = [
    { id: "survey1", title: "Complete a Survey", description: "Share your opinion", reward: 25, icon: "📝", url: "https://www.surveyjunkie.com" },
    { id: "app1", title: "Install Free App", description: "Download and open", reward: 50, icon: "📱", url: "https://play.google.com/store/apps" },
    { id: "signup1", title: "Sign Up for Newsletter", description: "Join mailing list", reward: 30, icon: "📧", url: "https://mailchimp.com" }
  ];

  const affiliateDeals = [
    { id: "binance", title: "Binance", description: "Sign up for crypto exchange", reward: 500, icon: "🟡", url: "https://www.binance.com" },
    { id: "coinbase", title: "Coinbase", description: "Join crypto platform", reward: 300, icon: "🔵", url: "https://www.coinbase.com" },
    { id: "paypal", title: "PayPal", description: "Send money worldwide", reward: 200, icon: "🔷", url: "https://www.paypal.com" }
  ];

  // ============================================================
  // PLATFORMS
  // ============================================================
  const platformCategories = {
    "🔍 Search & Social": [
      { name: "Google", icon: "🔍", url: "https://www.google.com" },
      { name: "YouTube", icon: "▶️", url: "https://www.youtube.com" },
      { name: "Facebook", icon: "📘", url: "https://www.facebook.com" },
      { name: "Instagram", icon: "📷", url: "https://www.instagram.com" },
      { name: "Twitter", icon: "🐦", url: "https://twitter.com" },
      { name: "TikTok", icon: "🎵", url: "https://www.tiktok.com" }
    ],
    "💰 Crypto & Finance": [
      { name: "Binance", icon: "🟡", url: "https://www.binance.com" },
      { name: "Coinbase", icon: "🔵", url: "https://www.coinbase.com" },
      { name: "PayPal", icon: "🔷", url: "https://www.paypal.com" }
    ],
    "📺 Entertainment": [
      { name: "Netflix", icon: "📺", url: "https://www.netflix.com" },
      { name: "Spotify", icon: "🎵", url: "https://www.spotify.com" },
      { name: "Twitch", icon: "🎮", url: "https://www.twitch.tv" }
    ]
  };

  // ============================================================
  // HELPER FUNCTIONS
  // ============================================================
  function openUrl(url) {
    if (!url) return;
    let finalUrl = url.trim();
    if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
      finalUrl = 'https://' + finalUrl;
    }
    try { new URL(finalUrl); window.open(finalUrl, '_blank'); } catch(e) { alert('Invalid URL'); }
  }

  function formatPoints(p) { return p ? p.toFixed(0) : "0"; }
  function formatMoney(v) { return v ? v.toFixed(2) : "0.00"; }
  function pointsToCash(points) { return (points / POINTS_FOR_5_DOLLARS) * 5; }

  // ============================================================
  // REWARDED AD
  // ============================================================
  async function watchRewardedAd() {
    if (!currentUser) { alert("Please login first"); return; }
    if (rewardedAdsToday >= MAX_REWARDED_ADS_DAILY) {
      alert(`Daily limit: ${MAX_REWARDED_ADS_DAILY} ads. Come back tomorrow!`);
      return;
    }
    window.open('https://omg10.com/4/11140123', '_blank');
    setTimeout(async () => {
      const confirmed = confirm("Did you watch the ad completely?");
      if (confirmed) {
        const multiplier = userData?.isVIP ? 2 : 1;
        const points = REWARDED_AD_POINTS * multiplier;
        rewardedAdsToday++;
        await db.collection("users").doc(currentUser.uid).update({
          points: firebase.firestore.FieldValue.increment(points),
          totalPoints: firebase.firestore.FieldValue.increment(points),
          adsWatched: firebase.firestore.FieldValue.increment(1)
        });
        await loadUserData();
        alert(`🎬 +${points} points! (${rewardedAdsToday}/${MAX_REWARDED_ADS_DAILY} today)`);
        renderDashboard();
      }
    }, 5000);
  }

  // ============================================================
  // DAILY CHECK-IN
  // ============================================================
  async function claimDaily() {
    if (!currentUser) { alert("Please login first"); return; }
    if (todayClaimed) { alert("Already claimed today!"); return; }
    const today = new Date().toISOString().split('T')[0];
    const userRef = db.collection("users").doc(currentUser.uid);
    const claimRef = userRef.collection("dailyClaims").doc(today);
    let streak = userData?.streak || 0;
    const lastClaimDate = userData?.lastClaimDate;
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    if (lastClaimDate === yesterday.toISOString().split('T')[0]) streak++;
    else if (lastClaimDate !== today) streak = 1;
    let reward = DAILY_STREAK_BASE;
    if (streak >= 30) reward = 100;
    else if (streak >= 14) reward = 50;
    else if (streak >= 7) reward = 25;
    else if (streak >= 3) reward = 10;
    if (userData?.isVIP) reward *= 2;
    try {
      await db.runTransaction(async (transaction) => {
        const claimDoc = await transaction.get(claimRef);
        if (claimDoc.exists) throw new Error("Already claimed");
        transaction.set(claimRef, { claimedAt: new Date() });
        transaction.update(userRef, {
          points: firebase.firestore.FieldValue.increment(reward),
          totalPoints: firebase.firestore.FieldValue.increment(reward),
          streak: streak,
          lastClaimDate: today
        });
      });
      await loadUserData();
      todayClaimed = true;
      alert(`🎉 +${reward} points! ${streak} day streak!`);
      renderDashboard();
    } catch (error) { alert(error.message); }
  }

  // ============================================================
  // COMPLETE OFFER
  // ============================================================
  async function completeOffer(offer) {
    if (!currentUser) { alert("Please login first"); return; }
    openUrl(offer.url);
    setTimeout(async () => {
      const completed = confirm(`Did you complete: ${offer.title}?`);
      if (completed) {
        const multiplier = userData?.isVIP ? 2 : 1;
        const reward = offer.reward * multiplier;
        await db.collection("users").doc(currentUser.uid).update({
          points: firebase.firestore.FieldValue.increment(reward),
          totalPoints: firebase.firestore.FieldValue.increment(reward)
        });
        await loadUserData();
        alert(`✅ +${reward} points!`);
        renderDashboard();
      }
    }, 30000);
  }

  // ============================================================
  // AFFILIATE DEAL
  // ============================================================
  async function completeAffiliateDeal(deal) {
    if (!currentUser) { alert("Please login first"); return; }
    openUrl(deal.url);
    setTimeout(async () => {
      const completed = confirm(`Did you complete: ${deal.title}?`);
      if (completed) {
        const multiplier = userData?.isVIP ? 2 : 1;
        const reward = deal.reward * multiplier;
        await db.collection("users").doc(currentUser.uid).update({
          points: firebase.firestore.FieldValue.increment(reward),
          totalPoints: firebase.firestore.FieldValue.increment(reward)
        });
        await loadUserData();
        alert(`✅ +${reward} points!`);
        renderDashboard();
      }
    }, 30000);
  }

  // ============================================================
  // REFERRAL SYSTEM
  // ============================================================
  async function signUp(email, password, username, referralCode) {
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      const uid = cred.user.uid;
      if (referralCode && referralCode.trim()) {
        const referrers = await db.collection("users").where("referralCode", "==", referralCode.trim().toUpperCase()).get();
        if (!referrers.empty) {
          const referrer = referrers.docs[0];
          await db.collection("users").doc(referrer.id).update({
            points: firebase.firestore.FieldValue.increment(500),
            totalPoints: firebase.firestore.FieldValue.increment(500),
            referralCount: firebase.firestore.FieldValue.increment(1)
          });
        }
      }
      await db.collection("users").doc(uid).set({
        username: username.trim(),
        email: email,
        points: 10,
        totalPoints: 10,
        streak: 0,
        adsWatched: 0,
        referralCount: 0,
        isVIP: false,
        lastClaimDate: null,
        createdAt: new Date(),
        pendingWithdrawal: null,
        paymentDetails: null,
        referralCode: generateReferralCode(email),
        referredBy: referralCode || null
      });
      alert(`✅ Account created! You got 10 points. ${referralCode ? "Your referrer got 500 points!" : "Share your code!"}`);
      return true;
    } catch (err) { alert(err.message); return false; }
  }

  function generateReferralCode(email) {
    return email.split('@')[0].slice(0, 4).toUpperCase() + Math.random().toString(36).substring(2, 6).toUpperCase();
  }

  // ============================================================
  // AUTHENTICATION
  // ============================================================
  async function signIn(email, password) {
    try {
      const userCred = await auth.signInWithEmailAndPassword(email, password);
      currentUser = { uid: userCred.user.uid, email: userCred.user.email };
      await loadUserData();
      const adminDoc = await db.collection("admins").doc(currentUser.uid).get();
      currentUser.isAdmin = adminDoc.exists;
      renderDashboard();
      return true;
    } catch (err) { alert(err.message); return false; }
  }

  async function signOut() {
    await auth.signOut();
    currentUser = null; userData = null;
    renderAuthScreen();
  }

  async function loadUserData() {
    if (!currentUser) return;
    const doc = await db.collection("users").doc(currentUser.uid).get();
    if (doc.exists) {
      userData = doc.data();
      const today = new Date().toISOString().split('T')[0];
      const claimDoc = await db.collection("users").doc(currentUser.uid).collection("dailyClaims").doc(today).get();
      todayClaimed = claimDoc.exists;
    } else {
      userData = { points: 0, totalPoints: 0, streak: 0, adsWatched: 0, referralCount: 0, isVIP: false, username: currentUser.email.split('@')[0], referralCode: "NONE" };
    }
  }

  async function fetchTransactions() {
    if (!currentUser) return [];
    const snap = await db.collection("users").doc(currentUser.uid).collection("transactions").orderBy("createdAt", "desc").limit(10).get();
    return snap.docs.map(d => d.data());
  }

  async function savePaymentDetails(bank, accountNumber, accountName) {
    if (!bank || !accountNumber || !accountName) { alert("All fields required"); return; }
    await db.collection("users").doc(currentUser.uid).update({
      paymentDetails: { bank, accountNumber, accountName, updatedAt: new Date() }
    });
    userData.paymentDetails = { bank, accountNumber, accountName };
    alert("✅ Payment details saved!");
    renderDashboard();
  }

  async function requestWithdrawal() {
    const points = userData?.points || 0;
    if (points < MIN_WITHDRAW_POINTS) {
      alert(`Need ${MIN_WITHDRAW_POINTS - points} more points.`);
      return;
    }
    if (!userData?.paymentDetails) { alert("❌ Add payment details first"); return; }
    const pending = await db.collection("withdrawalRequests").where("userId", "==", currentUser.uid).where("status", "==", "pending").get();
    if (!pending.empty) { alert("Already have a pending request."); return; }
    const cashValue = pointsToCash(points);
    await db.collection("withdrawalRequests").add({
      userId: currentUser.uid,
      username: userData.username,
      points: points,
      amount: cashValue,
      paymentDetails: userData.paymentDetails,
      status: "pending",
      createdAt: new Date()
    });
    alert(`✅ Withdrawal request for $${cashValue.toFixed(2)} submitted.`);
    renderDashboard();
  }

  // ============================================================
  // ADMIN FUNCTIONS
  // ============================================================
  async function getPendingWithdrawals() {
    const snap = await db.collection("withdrawalRequests").where("status", "==", "pending").get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
  async function approveWithdrawal(requestId, amount) {
    await db.collection("withdrawalRequests").doc(requestId).update({ status: "approved", approvedAt: new Date() });
    alert(`✅ Withdrawal approved for $${amount.toFixed(2)}. Send payment.`);
    renderDashboard();
  }
  async function rejectWithdrawal(requestId) {
    await db.collection("withdrawalRequests").doc(requestId).update({ status: "rejected", rejectedAt: new Date() });
    alert("❌ Withdrawal rejected.");
    renderDashboard();
  }

  // ============================================================
  // RENDER FUNCTIONS
  // ============================================================
  function renderPlatforms() {
    let html = '<div class="url-bar"><input type="text" id="customUrlInput" placeholder="Enter any website URL..."><button id="goUrlBtn">Go</button></div>';
    for (const [category, platforms] of Object.entries(platformCategories)) {
      html += `<div class="section-title">${category}</div>`;
      html += `<div class="platform-grid">`;
      platforms.forEach(p => {
        html += `<div class="platform-card" data-url="${p.url}"><div class="platform-icon">${p.icon}</div><div class="platform-name">${p.name}</div></div>`;
      });
      html += `</div>`;
    }
    return html;
  }

  function renderEarnTab() {
    const remainingAds = MAX_REWARDED_ADS_DAILY - rewardedAdsToday;
    return `
      <div class="balance-card">
        <div class="balance-amount">${formatPoints(userData?.points || 0)} Points</div>
        <div style="font-size: 0.7rem; color: #4ade80;">≈ $${formatMoney(pointsToCash(userData?.points || 0))} USD</div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${Math.min(((userData?.points || 0) / MIN_WITHDRAW_POINTS) * 100, 100)}%;"></div></div>
        <div class="stats">
          <div class="stat"><div class="stat-label">STREAK</div><div class="stat-value">🔥 ${userData?.streak || 0}</div></div>
          <div class="stat"><div class="stat-label">ADS</div><div class="stat-value">${userData?.adsWatched || 0}</div></div>
          <div class="stat"><div class="stat-label">VIP</div><div class="stat-value">${userData?.isVIP ? '👑 YES' : '❌ NO'}</div></div>
        </div>
      </div>
      
      <div class="task-card">
        <div><div class="task-name">🎬 Watch Rewarded Ad</div><div class="task-reward">+${REWARDED_AD_POINTS * (userData?.isVIP ? 2 : 1)} points</div></div>
        <button id="watchAdBtn" class="btn-ad">Watch Ad (${remainingAds}/${MAX_REWARDED_ADS_DAILY})</button>
      </div>
      
      <div class="task-card">
        <div><div class="task-name">📅 Daily Check-in</div><div class="task-reward">+${userData?.isVIP ? (userData?.streak >= 30 ? 200 : userData?.streak >= 14 ? 100 : userData?.streak >= 7 ? 50 : userData?.streak >= 3 ? 20 : 10) : (userData?.streak >= 30 ? 100 : userData?.streak >= 14 ? 50 : userData?.streak >= 7 ? 25 : userData?.streak >= 3 ? 10 : 5)} points</div></div>
        <button id="dailyBtn" class="task-btn" ${todayClaimed ? 'disabled' : ''}>${todayClaimed ? '✓ Claimed' : 'Claim'}</button>
      </div>
      
      <div class="info-card">🔗 <strong>Your Referral Code:</strong> <span style="font-family: monospace;">${userData?.referralCode || 'NONE'}</span><br>Share this code! You get 500 points per referral. <strong>${userData?.referralCount || 0} referrals</strong></div>
    `;
  }

  function renderOfferwallTab() {
    return `
      <div class="section-title">📋 Complete Offers & Earn Points</div>
      ${offerwallOffers.map(offer => `
        <div class="offer-card" data-offer='${JSON.stringify(offer)}'>
          <div class="offer-title">${offer.icon} ${offer.title}</div>
          <div class="offer-desc">${offer.description}</div>
          <div class="offer-reward">+${offer.reward * (userData?.isVIP ? 2 : 1)} points</div>
        </div>
      `).join('')}
      <div class="info-card">💡 Complete offers from our partners. Each completion takes 1-5 minutes.</div>
    `;
  }

  function renderAffiliateTab() {
    return `
      <div class="section-title">🤝 Affiliate Deals - Earn Big!</div>
      ${affiliateDeals.map(deal => `
        <div class="deal-card" data-deal='${JSON.stringify(deal)}'>
          <div class="deal-title">${deal.icon} ${deal.title}</div>
          <div class="deal-desc">${deal.description}</div>
          <div class="deal-reward">+${deal.reward * (userData?.isVIP ? 2 : 1)} points</div>
        </div>
      `).join('')}
      <div class="info-card">💰 These deals pay the highest rewards. Complete actions on partner sites.</div>
    `;
  }

  function renderReferralTab() {
    return `
      <div class="section-title">🏆 Referral Contest</div>
      <div class="info-card">🎯 Your referrals: ${userData?.referralCount || 0}</div>
      <div class="info-card">✨ Share your code: <strong>${userData?.referralCode || 'NONE'}</strong></div>
      <div class="info-card">💡 Each friend who signs up gives you 500 points!</div>
    `;
  }

  function renderAdminTab() {
    return `
      <div class="section-title">👑 Admin Dashboard</div>
      <div id="adminWithdrawals"></div>
      <div class="info-card">📊 Check pending withdrawals below</div>
    `;
  }

  async function renderDashboard() {
    if (currentUser?.isAdmin) {
      const pendingWithdrawals = await getPendingWithdrawals();
      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="flex-between"><h1>👑 CentLock Admin</h1><button id="logoutBtn" class="btn-outline">Logout</button></div>
        <div class="section-title">💰 Pending Withdrawals (${pendingWithdrawals.length})</div>
        <div id="adminContent"></div>
      `;
      const adminDiv = document.getElementById("adminContent");
      if (pendingWithdrawals.length === 0) {
        adminDiv.innerHTML = '<div class="info-card">✅ No pending withdrawals</div>';
      } else {
        adminDiv.innerHTML = pendingWithdrawals.map(req => `
          <div class="admin-card" style="background:#1a1f30; border-radius:1rem; padding:0.8rem; margin-bottom:0.8rem;">
            <div><strong>${req.username}</strong> (${req.userId})</div>
            <div>Amount: $${req.amount.toFixed(2)} (${req.points} pts)</div>
            <div>Bank: ${req.paymentDetails?.bank || 'N/A'}</div>
            <div>Account: ${req.paymentDetails?.accountNumber || 'N/A'}</div>
            <div class="flex-between" style="margin-top:0.5rem;">
              <button id="approve_${req.id}" class="btn-primary" style="flex:1;">✅ Approve</button>
              <button id="reject_${req.id}" class="btn-outline" style="flex:1;">❌ Reject</button>
            </div>
          </div>
        `).join('');
        for (const req of pendingWithdrawals) {
          document.getElementById(`approve_${req.id}`)?.addEventListener('click', () => approveWithdrawal(req.id, req.amount));
          document.getElementById(`reject_${req.id}`)?.addEventListener('click', () => rejectWithdrawal(req.id));
        }
      }
      document.getElementById("logoutBtn")?.addEventListener('click', () => signOut());
      return;
    }

    if (!currentUser) { renderAuthScreen(); return; }
    if (!userData) await loadUserData();
    if (!userData) { renderAuthScreen(); return; }

    const transactions = await fetchTransactions();

    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="flex-between">
        <h1>💰 CentLock</h1>
        <button id="logoutBtn" class="btn-outline" style="width: auto; padding: 0.3rem 1rem;">Logout</button>
      </div>
      <div style="font-size: 0.6rem; text-align: center; color: #8aa0bc;">👋 ${userData.username} · ${currentUser.email}${userData?.isVIP ? ' <span class="vip-badge">VIP</span>' : ''}</div>
      
      <div class="tabs">
        <div class="tab ${currentTab === 'earn' ? 'active' : ''}" data-tab="earn">💰 Earn</div>
        <div class="tab ${currentTab === 'offerwall' ? 'active' : ''}" data-tab="offerwall">🎁 Offers</div>
        <div class="tab ${currentTab === 'affiliate' ? 'active' : ''}" data-tab="affiliate">🤝 Deals</div>
        <div class="tab ${currentTab === 'referral' ? 'active' : ''}" data-tab="referral">👥 Refer</div>
        <div class="tab ${currentTab === 'platforms' ? 'active' : ''}" data-tab="platforms">🌐 Web</div>
      </div>
      
      <div id="tabContent">
        ${currentTab === 'earn' ? renderEarnTab() : 
          currentTab === 'offerwall' ? renderOfferwallTab() :
          currentTab === 'affiliate' ? renderAffiliateTab() :
          currentTab === 'referral' ? renderReferralTab() :
          renderPlatforms()}
      </div>
      
      <div class="info-card">💳 Payment Details</div>
      <div class="input-group"><span>🏦</span><input type="text" id="bankName" placeholder="Bank (OPay, GTBank, etc.)" value="${userData?.paymentDetails?.bank || ''}"></div>
      <div class="input-group"><span>🔢</span><input type="text" id="accountNumber" placeholder="Account/Phone Number" value="${userData?.paymentDetails?.accountNumber || ''}"></div>
      <div class="input-group"><span>👤</span><input type="text" id="accountName" placeholder="Full Name" value="${userData?.paymentDetails?.accountName || ''}"></div>
      <button id="savePaymentBtn" class="btn-outline">💾 Save Details</button>
      
      <button id="withdrawBtn" class="btn btn-primary" ${(userData?.points || 0) < MIN_WITHDRAW_POINTS ? 'disabled' : ''}>
        ${(userData?.points || 0) >= MIN_WITHDRAW_POINTS ? `💰 Withdraw $${formatMoney(pointsToCash(userData?.points || 0))}` : `🔒 Need ${MIN_WITHDRAW_POINTS - (userData?.points || 0)} more points`}
      </button>
      
      <hr />
      <div class="flex-between"><span style="font-size: 0.6rem; font-weight: 600;">📜 Recent Activity</span></div>
      <div class="tx-list" id="txList"></div>
    `;

    const txContainer = document.getElementById("txList");
    if (!transactions || transactions.length === 0) txContainer.innerHTML = '<div class="tx-item">✨ No earnings yet</div>';
    else txContainer.innerHTML = transactions.map(tx => `<div class="tx-item"><span>${tx.type?.toUpperCase() || 'Activity'}</span><span class="positive">+${tx.points || 0} pts</span></div>`).join('');

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        currentTab = tab.dataset.tab;
        renderDashboard();
      });
    });

    // Platform cards
    document.querySelectorAll('.platform-card').forEach(card => {
      card.addEventListener('click', () => { const url = card.dataset.url; if(url) openUrl(url); });
    });
    document.getElementById('goUrlBtn')?.addEventListener('click', () => {
      const url = document.getElementById('customUrlInput')?.value;
      if(url) openUrl(url);
    });

    // Earn tab buttons
    document.getElementById('watchAdBtn')?.addEventListener('click', () => watchRewardedAd());
    document.getElementById('dailyBtn')?.addEventListener('click', () => claimDaily());
    document.getElementById('savePaymentBtn')?.addEventListener('click', () => {
      const bank = document.getElementById('bankName')?.value;
      const accNum = document.getElementById('accountNumber')?.value;
      const accName = document.getElementById('accountName')?.value;
      if (bank && accNum && accName) savePaymentDetails(bank, accNum, accName);
      else alert("Fill all payment details");
    });
    document.getElementById('withdrawBtn')?.addEventListener('click', () => requestWithdrawal());
    document.getElementById('logoutBtn')?.addEventListener('click', () => signOut());

    // Offerwall cards
    document.querySelectorAll('.offer-card').forEach(card => {
      card.addEventListener('click', () => {
        const offer = JSON.parse(card.dataset.offer);
        completeOffer(offer);
      });
    });

    // Affiliate deal cards
    document.querySelectorAll('.deal-card').forEach(card => {
      card.addEventListener('click', () => {
        const deal = JSON.parse(card.dataset.deal);
        completeAffiliateDeal(deal);
      });
    });
  }

  function renderAuthScreen() {
    const app = document.getElementById("app");
    app.innerHTML = `
      <h1>💰 CentLock</h1>
      <div class="info-card">Earn points: Watch ads · Complete offers · Refer friends</div>
      <div class="balance-card"><div style="font-size: 1rem; font-weight: 700;">Welcome to CentLock!</div></div>
      <div class="info-card">🔐 Login</div>
      <div class="input-group"><span>📧</span><input type="email" id="loginEmail" placeholder="Email"></div>
      <div class="input-group"><span>🔒</span><input type="password" id="loginPass" placeholder="Password"></div>
      <button id="loginBtn" class="btn-primary">Login</button>
      <hr>
      <div class="info-card">📝 Create Account (Get 10 bonus points)</div>
      <div class="input-group"><span>📧</span><input type="email" id="regEmail" placeholder="Email"></div>
      <div class="input-group"><span>👤</span><input type="text" id="regUsername" placeholder="Username"></div>
      <div class="input-group"><span>🔒</span><input type="password" id="regPass" placeholder="Password (min 6)"></div>
      <div class="input-group"><span>🔗</span><input type="text" id="regRef" placeholder="Referral code (optional)"></div>
      <button id="registerBtn" class="btn-success">Sign Up</button>
    `;
    document.getElementById("loginBtn")?.addEventListener('click', async () => {
      const email = document.getElementById("loginEmail").value;
      const pwd = document.getElementById("loginPass").value;
      await signIn(email, pwd);
    });
    document.getElementById("registerBtn")?.addEventListener('click', async () => {
      const pwd = document.getElementById("regPass").value;
      if (pwd.length < 6) { alert("Password min 6 characters"); return; }
      await signUp(
        document.getElementById("regEmail").value,
        pwd,
        document.getElementById("regUsername").value,
        document.getElementById("regRef").value
      );
    });
  }

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = { uid: user.uid, email: user.email };
      await loadUserData();
      const adminDoc = await db.collection("admins").doc(currentUser.uid).get();
      currentUser.isAdmin = adminDoc.exists;
      renderDashboard();
    } else {
      renderAuthScreen();
    }
  });
</script>
</body>
</html>
