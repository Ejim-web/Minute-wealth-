<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>CentLock · Earn Points + Access Platforms</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #0a0f1a; min-height: 100vh; padding: 1rem; display: flex; justify-content: center; align-items: center; }
    .container { max-width: 550px; width: 100%; background: #0f1422; border-radius: 2rem; padding: 1.5rem; border: 1px solid #4CAF50; }
    h1 { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #4CAF50, #81C784); -webkit-background-clip: text; background-clip: text; color: transparent; text-align: center; }
    
    /* Section Titles */
    .section-title { font-size: 0.8rem; font-weight: 700; color: #8BC34A; margin: 0.8rem 0 0.5rem 0; display: flex; align-items: center; gap: 0.5rem; }
    .section-title span { background: #1e2a3a; padding: 0.2rem 0.5rem; border-radius: 1rem; font-size: 0.6rem; }
    
    /* Platform Grid */
    .platform-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin: 0.5rem 0 1rem 0; }
    .platform-card { background: #0f172a; border-radius: 1rem; padding: 0.6rem 0.2rem; text-align: center; cursor: pointer; border: 1px solid #2a2f42; transition: 0.1s; }
    .platform-card:active { transform: scale(0.96); background: #1e2a3a; }
    .platform-icon { font-size: 1.5rem; }
    .platform-name { font-size: 0.65rem; font-weight: 600; color: white; margin-top: 0.2rem; }
    
    /* URL Bar */
    .url-bar { display: flex; gap: 0.5rem; background: #0f172a; border-radius: 2rem; padding: 0.2rem 0.5rem 0.2rem 1rem; border: 1px solid #2a2f42; margin: 0.5rem 0 0.8rem 0; }
    .url-bar input { flex: 1; background: transparent; border: none; padding: 0.7rem 0; color: white; font-size: 0.85rem; outline: none; }
    .url-bar button { background: #4CAF50; border: none; border-radius: 2rem; padding: 0.4rem 1rem; color: white; font-weight: bold; cursor: pointer; }
    .quick-links { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.8rem; }
    .quick-chip { background: #1e2a3a; padding: 0.3rem 0.8rem; border-radius: 2rem; font-size: 0.65rem; color: #8BC34A; cursor: pointer; border: 1px solid #2a2f42; }
    
    .balance-card { background: linear-gradient(135deg, #1a1f30, #0f1422); border-radius: 1.5rem; padding: 1rem; margin: 1rem 0; text-align: center; border: 1px solid #2a2f42; }
    .balance-amount { font-size: 2.5rem; font-weight: 800; color: white; }
    .progress-bar { background: #2a2f42; border-radius: 1rem; height: 6px; margin: 0.5rem 0; overflow: hidden; }
    .progress-fill { background: linear-gradient(90deg, #4CAF50, #81C784); height: 100%; width: 0%; transition: width 0.3s; }
    .stats { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .stat { background: #0f1422; flex: 1; padding: 0.3rem; border-radius: 1rem; text-align: center; }
    .stat-label { font-size: 0.55rem; color: #8aa0bc; text-transform: uppercase; }
    .stat-value { font-size: 0.9rem; font-weight: 700; color: white; }
    
    .btn { width: 100%; padding: 0.8rem; border: none; border-radius: 2rem; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin: 0.5rem 0; transition: 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #2E7D32, #4CAF50); color: white; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 1px solid #4CAF50; color: #4CAF50; }
    .btn-warning { background: #F57C00; color: white; }
    .btn-test { background: #F57C00; color: white; font-size: 0.7rem; padding: 0.4rem; margin-top: 0.2rem; }
    
    .input-group { background: #0f1422; border-radius: 2rem; padding: 0.2rem 1rem; display: flex; gap: 0.5rem; margin: 0.8rem 0; border: 1px solid #2a2f42; }
    .input-group input { background: transparent; border: none; flex: 1; color: white; font-size: 0.9rem; outline: none; }
    .info-card { background: #0f3b5c30; border-left: 3px solid #4CAF50; padding: 0.6rem; border-radius: 1rem; font-size: 0.65rem; color: #C8E6C9; margin: 0.5rem 0; }
    .countdown { font-size: 1.5rem; font-weight: 800; color: #F57C00; text-align: center; }
    .tx-list { max-height: 150px; overflow-y: auto; margin-top: 0.5rem; }
    .tx-item { background: #0f1422; padding: 0.4rem; border-radius: 0.8rem; margin-bottom: 0.3rem; display: flex; justify-content: space-between; font-size: 0.65rem; }
    .positive { color: #4ade80; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    hr { border-color: #2a2f42; margin: 0.8rem 0; }
  </style>
</head>
<body>
<div class="container" id="app">
  <div style="text-align: center; padding: 2rem; color: #8aa0bc;">💰 Loading CentLock...</div>
</div>

<script>
  // ============================================================
  // FIREBASE CONFIGURATION
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDiZsP0tcprL1xIhu-sCkGP-4Mfv_Rw9dg",
    authDomain: "joblink-d3d17.firebaseapp.com",
    projectId: "joblink-d3d17",
    storageBucket: "joblink-d3d17.firebasestorage.app",
    messagingSenderId: "462684482263",
    appId: "1:462684482263:web:981dcbe334850ca3fe5e92"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ============================================================
  // APP CONFIGURATION
  // ============================================================
  const AD_URL = "https://omg10.com/4/11140123";
  const POINTS_PER_AD = 1;                    
  const POINTS_FOR_5_DOLLARS = 9640;
  const MIN_WITHDRAW_POINTS = POINTS_FOR_5_DOLLARS;
  const CYCLE_SECONDS = 45;

  let currentUser = null;
  let userData = null;
  let cycleInterval = null;
  let adWindow = null;
  let countdownInterval = null;

  // ============================================================
  // POPULAR PLATFORMS (Displayed on Dashboard)
  // ============================================================
  const popularPlatforms = [
    { name: "Google", icon: "🔍", url: "https://www.google.com" },
    { name: "YouTube", icon: "▶️", url: "https://www.youtube.com" },
    { name: "WhatsApp", icon: "💬", url: "https://web.whatsapp.com" },
    { name: "Telegram", icon: "✈️", url: "https://web.telegram.org" },
    { name: "Binance", icon: "🟡", url: "https://www.binance.com" },
    { name: "Coinbase", icon: "🔵", url: "https://www.coinbase.com" },
    { name: "PayPal", icon: "🔷", url: "https://www.paypal.com" },
    { name: "Netflix", icon: "📺", url: "https://www.netflix.com" },
    { name: "Amazon", icon: "📦", url: "https://www.amazon.com" },
    { name: "ChatGPT", icon: "🤖", url: "https://chat.openai.com" },
    { name: "Facebook", icon: "📘", url: "https://www.facebook.com" },
    { name: "Instagram", icon: "📷", url: "https://www.instagram.com" },
    { name: "Twitter", icon: "🐦", url: "https://twitter.com" },
    { name: "TikTok", icon: "🎵", url: "https://www.tiktok.com" },
    { name: "Reddit", icon: "🤖", url: "https://www.reddit.com" },
    { name: "LinkedIn", icon: "🔗", url: "https://www.linkedin.com" },
    { name: "Spotify", icon: "🎵", url: "https://www.spotify.com" },
    { name: "Twitch", icon: "🎮", url: "https://www.twitch.tv" }
  ];

  function openUrl(url) {
    let finalUrl = url;
    if (!finalUrl.startsWith('http')) finalUrl = 'https://' + finalUrl;
    window.open(finalUrl, '_blank');
  }

  function formatPoints(p) { return p ? p.toFixed(0) : "0"; }
  function formatMoney(v) { return v ? v.toFixed(2) : "0.00"; }
  
  function generateReferralCode(email) {
    if (!email) return "CENTLOCK" + Math.random().toString(36).substring(2, 8).toUpperCase();
    const prefix = email.split('@')[0].slice(0, 4).toUpperCase();
    return prefix + Math.random().toString(36).substring(2, 6).toUpperCase();
  }

  function pointsToCash(points) {
    return (points / POINTS_FOR_5_DOLLARS) * 5;
  }

  // ============================================================
  // ADD POINTS FUNCTION
  // ============================================================
  async function addPoints(points) {
    if (!currentUser) return false;
    const userRef = db.collection("users").doc(currentUser.uid);
    try {
      const doc = await userRef.get();
      if (!doc.exists) return false;
      const currentPoints = doc.data().points || 0;
      await userRef.update({
        points: currentPoints + points,
        totalPoints: firebase.firestore.FieldValue.increment(points),
        totalAds: firebase.firestore.FieldValue.increment(1)
      });
      await userRef.collection('transactions').add({
        type: 'ad_earned', points: points, cashValue: pointsToCash(points), createdAt: new Date()
      });
      const updatedDoc = await userRef.get();
      userData = updatedDoc.data();
      return true;
    } catch (error) { console.error("Credit error:", error); return false; }
  }

  // ============================================================
  // WATCH AD
  // ============================================================
  let isProcessingAd = false;
  
  async function watchAd() {
    if (!currentUser || !userData) { alert("Please login first"); return; }
    if (isProcessingAd) { alert("Please wait, ad is already playing..."); return; }
    
    isProcessingAd = true;
    updateAdStatus('📺 Opening ad...');
    
    adWindow = window.open(AD_URL, '_blank');
    updateAdStatus('📺 Ad open! Watching for 12 seconds...');
    
    await new Promise(resolve => setTimeout(resolve, 12000));
    
    if (adWindow && !adWindow.closed) adWindow.close();
    
    updateAdStatus('💰 Adding points...');
    const success = await addPoints(POINTS_PER_AD);
    
    if (success) {
      const cashValue = pointsToCash(userData?.points || 0);
      updateAdStatus(`✅ +1 Point! Total: ${userData?.points || 0} pts`);
      alert(`🎉 +1 Point earned! Total: ${userData?.points || 0} points\n≈ $${cashValue.toFixed(2)} USD`);
      renderDashboard();
    } else {
      updateAdStatus('❌ Error adding points. Try again.');
      alert("Error adding points. Please try again.");
    }
    isProcessingAd = false;
    startCountdown();
  }
  
  function startCountdown() {
    if (countdownInterval) clearInterval(countdownInterval);
    let secondsLeft = CYCLE_SECONDS;
    updateCountdownDisplay(secondsLeft);
    countdownInterval = setInterval(() => {
      secondsLeft--;
      updateCountdownDisplay(secondsLeft);
      if (secondsLeft <= 0) {
        clearInterval(countdownInterval);
        countdownInterval = null;
        watchAd();
      }
    }, 1000);
  }
  
  function updateCountdownDisplay(seconds) {
    const timerDiv = document.getElementById('countdownTimer');
    if (timerDiv) timerDiv.innerHTML = `${seconds}s`;
  }

  function updateAdStatus(message) {
    const statusDiv = document.getElementById('adStatusMsg');
    if (statusDiv) statusDiv.innerHTML = message;
  }

  function stopAdCycle() {
    if (countdownInterval) clearInterval(countdownInterval);
    if (adWindow && !adWindow.closed) adWindow.close();
    isProcessingAd = false;
  }

  async function testAddPoints() {
    if (!currentUser) { alert("Please login first"); return; }
    await addPoints(10);
    renderDashboard();
    alert("Test: Added 10 points.");
  }

  // ============================================================
  // AUTHENTICATION
  // ============================================================
  async function signUp(email, password, username) {
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      const referralCode = generateReferralCode(email);
      await db.collection("users").doc(cred.user.uid).set({
        username: username.trim(), email: email, points: 10, totalPoints: 10, totalAds: 0,
        createdAt: new Date(), pendingWithdrawal: null, paymentDetails: null, referralCode: referralCode
      });
      alert("✅ Account created! You got 10 bonus points!");
      return true;
    } catch (err) { alert(err.message); return false; }
  }

  async function signIn(email, password) {
    try { await auth.signInWithEmailAndPassword(email, password); return true; } 
    catch (err) { alert(err.message); return false; }
  }

  async function signOut() {
    stopAdCycle();
    await auth.signOut();
    currentUser = null; userData = null;
    renderAuthScreen();
  }

  async function loadUserData() {
    if (!currentUser) return;
    const doc = await db.collection("users").doc(currentUser.uid).get();
    if (doc.exists) userData = doc.data();
    else {
      const newReferralCode = generateReferralCode(currentUser.email);
      await db.collection("users").doc(currentUser.uid).set({
        username: currentUser.email.split('@')[0], email: currentUser.email,
        points: 10, totalPoints: 10, totalAds: 0, createdAt: new Date(),
        pendingWithdrawal: null, paymentDetails: null, referralCode: newReferralCode
      });
      userData = { points: 10, totalPoints: 10, totalAds: 0, username: currentUser.email.split('@')[0], referralCode: newReferralCode };
    }
  }

  async function fetchTransactions() {
    if (!currentUser) return [];
    const snap = await db.collection("users").doc(currentUser.uid).collection("transactions").orderBy("createdAt", "desc").limit(10).get();
    return snap.docs.map(d => d.data());
  }

  async function savePaymentDetails(bank, accountNumber, accountName) {
    await db.collection("users").doc(currentUser.uid).update({
      paymentDetails: { bank, accountNumber, accountName, updatedAt: new Date() }
    });
    userData.paymentDetails = { bank, accountNumber, accountName };
    alert("✅ Payment details saved!");
    renderDashboard();
  }

  async function requestWithdrawal() {
    const points = userData?.points || 0;
    const cashValue = pointsToCash(points);
    const paymentDetails = userData?.paymentDetails;
    
    if (!paymentDetails) { alert("❌ Please add your payment details first"); return; }
    if (points < MIN_WITHDRAW_POINTS) {
      alert(`Need ${MIN_WITHDRAW_POINTS - points} more points. Minimum ${MIN_WITHDRAW_POINTS} points = $5.00`);
      return;
    }
    const pending = await db.collection("withdrawalRequests").where("userId", "==", currentUser.uid).where("status", "==", "pending").get();
    if (!pending.empty) { alert("You have a pending request."); return; }
    
    await db.collection("withdrawalRequests").add({
      userId: currentUser.uid, username: userData.username, points: points, amount: cashValue,
      paymentDetails: paymentDetails, status: "pending", createdAt: new Date()
    });
    alert(`✅ Withdrawal request for ${points} points ($${cashValue.toFixed(2)}) submitted.`);
    renderDashboard();
  }

  // ============================================================
  // RENDER DASHBOARD WITH PLATFORMS
  // ============================================================
  async function renderDashboard() {
    if (!currentUser || !userData) return;
    const transactions = await fetchTransactions();
    const points = userData?.points || 0;
    const totalPoints = userData?.totalPoints || 0;
    const totalAds = userData?.totalAds || 0;
    const cashValue = pointsToCash(points);
    const progress = Math.min((points / MIN_WITHDRAW_POINTS) * 100, 100);
    const paymentDetails = userData?.paymentDetails;
    const referralCode = userData?.referralCode || "CENTLOCK";
    const canWithdraw = points >= MIN_WITHDRAW_POINTS;
    
    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="flex-between">
        <h1>💰 CentLock</h1>
        <button id="logoutBtn" class="btn-outline" style="width: auto; padding: 0.3rem 1rem;">Logout</button>
      </div>
      <div style="font-size: 0.65rem; text-align: center; color: #8aa0bc;">👋 ${userData.username || 'User'} · ${currentUser.email}</div>
      
      <!-- Balance Card -->
      <div class="balance-card">
        <div class="balance-amount">${formatPoints(points)} Points</div>
        <div style="font-size: 0.8rem; color: #4ade80;">≈ $${formatMoney(cashValue)} USD</div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%;"></div></div>
        <div class="stats">
          <div class="stat"><div class="stat-label">GOAL</div><div class="stat-value">${MIN_WITHDRAW_POINTS} pts</div></div>
          <div class="stat"><div class="stat-label">ADS SEEN</div><div class="stat-value">${totalAds}</div></div>
          <div class="stat"><div class="stat-label">TOTAL PTS</div><div class="stat-value">${formatPoints(totalPoints)}</div></div>
        </div>
      </div>
      
      <!-- Ad Status -->
      <div class="info-card">
        <div id="adStatusMsg" style="text-align: center;">🟢 Auto ads active</div>
        <div class="countdown" id="countdownTimer" style="font-size: 1.8rem; font-weight: 800; color: #F57C00; text-align: center;">--s</div>
        <div style="text-align: center; font-size: 0.7rem;">Next ad in...</div>
      </div>
      
      <button id="watchAdNowBtn" class="btn-warning">🎬 Watch Ad Now (Manual)</button>
      
      <!-- ============================================================ -->
      <!-- POPULAR PLATFORMS SECTION - VISIBLE ON DASHBOARD -->
      <!-- ============================================================ -->
      <div class="section-title">🌐 POPULAR PLATFORMS <span>tap to open</span></div>
      
      <div class="url-bar">
        <input type="text" id="customUrlInput" placeholder="Or enter any website URL...">
        <button id="goUrlBtn">Go</button>
      </div>
      
      <div class="quick-links">
        <span class="quick-chip" data-url="https://www.google.com">Google</span>
        <span class="quick-chip" data-url="https://www.youtube.com">YouTube</span>
        <span class="quick-chip" data-url="https://web.whatsapp.com">WhatsApp</span>
        <span class="quick-chip" data-url="https://web.telegram.org">Telegram</span>
        <span class="quick-chip" data-url="https://chat.openai.com">ChatGPT</span>
        <span class="quick-chip" data-url="https://www.netflix.com">Netflix</span>
        <span class="quick-chip" data-url="https://www.binance.com">Binance</span>
        <span class="quick-chip" data-url="https://www.coinbase.com">Coinbase</span>
      </div>
      
      <div class="platform-grid">
        ${popularPlatforms.map(p => `<div class="platform-card" data-url="${p.url}"><div class="platform-icon">${p.icon}</div><div class="platform-name">${p.name}</div></div>`).join('')}
      </div>
      <!-- ============================================================ -->
      
      <!-- Payment Details -->
      <div class="info-card">💳 Payment Details (for withdrawal)</div>
      <div class="input-group"><span>🏦</span><input type="text" id="bankName" placeholder="Bank (e.g., OPay, GTBank)" value="${paymentDetails?.bank || ''}"></div>
      <div class="input-group"><span>🔢</span><input type="text" id="accountNumber" placeholder="Account/Phone Number" value="${paymentDetails?.accountNumber || ''}"></div>
      <div class="input-group"><span>👤</span><input type="text" id="accountName" placeholder="Full Name" value="${paymentDetails?.accountName || ''}"></div>
      <button id="savePaymentBtn" class="btn-outline">💾 Save Payment Details</button>
      
      <!-- Referral Code -->
      <div class="info-card">🔗 <strong>Your Referral Code:</strong> <span style="font-family: monospace; font-size: 1rem;">${referralCode}</span><br>Share this code! You get 500 points ($0.26) per referral.</div>
      
      <!-- Withdraw Button -->
      <button id="withdrawBtn" class="btn btn-primary" ${!canWithdraw ? 'disabled' : ''}>
        ${canWithdraw ? `💰 Withdraw $${formatMoney(cashValue)} (${formatPoints(points)} pts)` : `🔒 Need ${MIN_WITHDRAW_POINTS - points} more points to withdraw $5`}
      </button>
      
      <button id="testPointsBtn" class="btn-test">🧪 Test Add 10 Points (Admin)</button>
      
      <div class="info-card">
        📊 <strong>How It Works:</strong><br>
        • ${POINTS_PER_AD} Point per ad (every ${CYCLE_SECONDS} seconds)<br>
        • ${MIN_WITHDRAW_POINTS} Points = $5.00 withdrawal<br>
        • Keep this page open to earn automatically!
      </div>
      
      <hr />
      <div class="flex-between"><span style="font-size: 0.65rem; font-weight: 600;">📜 Recent Activity</span></div>
      <div class="tx-list" id="txList"></div>
    `;
    
    // Transactions
    const txContainer = document.getElementById("txList");
    if (!transactions || transactions.length === 0) {
      txContainer.innerHTML = '<div class="tx-item">✨ No earnings yet. Click "Watch Ad Now" to start!</div>';
    } else {
      txContainer.innerHTML = transactions.map(tx => `
        <div class="tx-item"><span>${tx.type?.toUpperCase() || 'Ad'}</span><span class="positive">+${tx.points || 0} pts</span></div>
      `).join('');
    }
    
    // Event Listeners
    document.querySelectorAll('.platform-card').forEach(card => {
      card.addEventListener('click', () => { const url = card.dataset.url; if(url) openUrl(url); });
    });
    document.querySelectorAll('.quick-chip').forEach(chip => {
      chip.addEventListener('click', () => { const url = chip.dataset.url; if(url) openUrl(url); });
    });
    document.getElementById('goUrlBtn')?.addEventListener('click', () => {
      const url = document.getElementById('customUrlInput')?.value;
      if(url) openUrl(url);
    });
    document.getElementById('watchAdNowBtn')?.addEventListener('click', () => watchAd());
    document.getElementById('savePaymentBtn')?.addEventListener('click', () => {
      const bank = document.getElementById('bankName')?.value;
      const accNum = document.getElementById('accountNumber')?.value;
      const accName = document.getElementById('accountName')?.value;
      if (bank && accNum && accName) savePaymentDetails(bank, accNum, accName);
      else alert("Please fill all payment details");
    });
    document.getElementById('withdrawBtn')?.addEventListener('click', () => requestWithdrawal());
    document.getElementById('logoutBtn')?.addEventListener('click', () => signOut());
    document.getElementById('testPointsBtn')?.addEventListener('click', () => testAddPoints());
    
    if (!countdownInterval) startCountdown();
  }

  function renderAuthScreen() {
    const app = document.getElementById("app");
    app.innerHTML = `
      <h1>💰 CentLock</h1>
      <div class="info-card">Earn ${POINTS_PER_AD} Point per ad · ${MIN_WITHDRAW_POINTS} Points = $5 · Withdraw at $5</div>
      <div class="balance-card"><div style="font-size: 1rem; font-weight: 700;">Welcome! Earn points, withdraw cash.</div></div>
      <div class="info-card">🔐 Login</div>
      <div class="input-group"><span>📧</span><input type="email" id="loginEmail" placeholder="Email"></div>
      <div class="input-group"><span>🔒</span><input type="password" id="loginPass" placeholder="Password"></div>
      <button id="loginBtn" class="btn-primary">Login</button>
      <hr>
      <div class="info-card">📝 Create Account (Get 10 bonus points)</div>
      <div class="input-group"><span>📧</span><input type="email" id="regEmail" placeholder="Email"></div>
      <div class="input-group"><span>👤</span><input type="text" id="regUsername" placeholder="Username"></div>
      <div class="input-group"><span>🔒</span><input type="password" id="regPass" placeholder="Password (min 6)"></div>
      <button id="registerBtn" class="btn-success">Sign Up & Get 10 Points</button>
      <div class="warning-card" style="margin-top: 1rem;">💡 Ads run automatically every ${CYCLE_SECONDS} seconds! Keep this page open to earn.</div>
    `;
    document.getElementById("loginBtn")?.addEventListener("click", async () => {
      if (await signIn(document.getElementById("loginEmail").value, document.getElementById("loginPass").value)) {
        currentUser = auth.currentUser;
        await loadUserData();
        renderDashboard();
      }
    });
    document.getElementById("registerBtn")?.addEventListener("click", async () => {
      const pwd = document.getElementById("regPass").value;
      if (pwd.length < 6) { alert("Password min 6 characters"); return; }
      await signUp(document.getElementById("regEmail").value, pwd, document.getElementById("regUsername").value);
    });
  }

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      await loadUserData();
      renderDashboard();
    } else {
      stopAdCycle();
      currentUser = null; userData = null;
      renderAuthScreen();
    }
  });
</script>
</body>
</html>
