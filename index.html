  function openUrl(url) {
    if (!url) return;
    let finalUrl = url.trim();
    if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
      finalUrl = 'https://' + finalUrl;
    }
    try { new URL(finalUrl); window.open(finalUrl, '_blank'); } catch(e) { alert('Invalid URL'); }
  }

  function makeCall(phoneNumber) {
    if (!phoneNumber) return;
    let number = phoneNumber.toString().trim();
    if (!number.startsWith('+') && !number.startsWith('0')) {
      number = '+' + number;
    }
    window.open(`tel:${number}`, '_blank');
  }

  function formatPoints(p) { return p ? p.toFixed(0) : "0"; }
  function formatMoney(v) { return v ? v.toFixed(2) : "0.00"; }
  function pointsToCash(points) { return (points / POINTS_FOR_5_DOLLARS) * 5; }

  function showAd() {
    window.open('https://omg10.com/4/11140123', '_blank');
  }

  // ============================================================
  // DAILY CHECK-IN
  // ============================================================
  async function claimDaily() {
    if (!currentUser) { alert("Please login first"); return; }
    if (todayClaimed) { alert("Already claimed today! Come back tomorrow."); return; }
    
    showAd();
    
    const today = new Date().toISOString().split('T')[0];
    const userRef = db.collection("users").doc(currentUser.uid);
    const claimRef = userRef.collection("dailyClaims").doc(today);
    let streak = userData?.streak || 0;
    const lastClaimDate = userData?.lastClaimDate;
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    if (lastClaimDate === yesterday.toISOString().split('T')[0]) streak++;
    else if (lastClaimDate !== today) streak = 1;
    let reward = DAILY_STREAK_BASE;
    if (streak >= 30) reward = 100;
    else if (streak >= 14) reward = 50;
    else if (streak >= 7) reward = 25;
    else if (streak >= 3) reward = 10;
    
    try {
      await db.runTransaction(async (transaction) => {
        const claimDoc = await transaction.get(claimRef);
        if (claimDoc.exists) throw new Error("Already claimed");
        transaction.set(claimRef, { claimedAt: new Date() });
        transaction.update(userRef, {
          points: firebase.firestore.FieldValue.increment(reward),
          totalPoints: firebase.firestore.FieldValue.increment(reward),
          streak: streak,
          lastClaimDate: today
        });
      });
      await loadUserData();
      todayClaimed = true;
      alert(`🎉 +${reward} points! ${streak} day streak!`);
      renderDashboard();
    } catch (error) { alert(error.message); }
  }

  async function signUp(email, password, username, referralCode) {
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      const uid = cred.user.uid;
      if (referralCode && referralCode.trim()) {
        const referrers = await db.collection("users").where("referralCode", "==", referralCode.trim().toUpperCase()).get();
        if (!referrers.empty) {
          const referrer = referrers.docs[0];
          await db.collection("users").doc(referrer.id).update({
            points: firebase.firestore.FieldValue.increment(500),
            totalPoints: firebase.firestore.FieldValue.increment(500),
            referralCount: firebase.firestore.FieldValue.increment(1)
          });
        }
      }
      await db.collection("users").doc(uid).set({
        username: username.trim(),
        email: email,
        points: 10,
        totalPoints: 10,
        streak: 0,
        adsWatched: 0,
        referralCount: 0,
        lastClaimDate: null,
        createdAt: new Date(),
        pendingWithdrawal: null,
        paymentDetails: null,
        referralCode: generateReferralCode(email),
        referredBy: referralCode || null
      });
      alert(`✅ Account created! You got 10 points. ${referralCode ? "Your referrer got 500 points!" : "Share your code!"}`);
      return true;
    } catch (err) { alert(err.message); return false; }
  }

  function generateReferralCode(email) {
    return email.split('@')[0].slice(0, 4).toUpperCase() + Math.random().toString(36).substring(2, 6).toUpperCase();
  }

  // ============================================================

  async function signIn(email, password) {
    try {
      const userCred = await auth.signInWithEmailAndPassword(email, password);
      currentUser = { uid: userCred.user.uid, email: userCred.user.email };
      await loadUserData();
      renderDashboard();
      return true;
    } catch (err) { alert(err.message); return false; }
  }

  async function signOut() {
    await auth.signOut();
    currentUser = null; userData = null;
    renderAuthScreen();
  }

  async function loadUserData() {
    if (!currentUser) return;
    const doc = await db.collection("users").doc(currentUser.uid).get();
    if (doc.exists) {
      userData = doc.data();
      const today = new Date().toISOString().split('T')[0];
      const claimDoc = await db.collection("users").doc(currentUser.uid).collection("dailyClaims").doc(today).get();
      todayClaimed = claimDoc.exists;
    } else {
      userData = { points: 0, totalPoints: 0, streak: 0, adsWatched: 0, referralCount: 0, username: currentUser.email.split('@')[0], referralCode: "NONE" };
    }
  }

  async function fetchTransactions() {
    if (!currentUser) return [];
    const snap = await db.collection("users").doc(currentUser.uid).collection("transactions").orderBy("createdAt", "desc").limit(10).get();
    return snap.docs.map(d => d.data());
  }

  async function savePaymentDetails(bank, accountNumber, accountName) {
    if (!bank || !accountNumber || !accountName) { alert("All fields required"); return; }
    await db.collection("users").doc(currentUser.uid).update({
      paymentDetails: { bank, accountNumber, accountName, updatedAt: new Date() }
    });
    userData.paymentDetails = { bank, accountNumber, accountName };
    alert("✅ Payment details saved!");
    renderDashboard();
  }

  async function requestWithdrawal() {
    const points = userData?.points || 0;
    if (points < MIN_WITHDRAW_POINTS) {
      alert(`Need ${MIN_WITHDRAW_POINTS - points} more points.`);
      return;
    }
    if (!userData?.paymentDetails) { alert("❌ Add payment details first"); return; }
    const pending = await db.collection("withdrawalRequests").where("userId", "==", currentUser.uid).where("status", "==", "pending").get();
    if (!pending.empty) { alert("Already have a pending request."); return; }
    const cashValue = pointsToCash(points);
    await db.collection("withdrawalRequests").add({
      userId: currentUser.uid,
      username: userData.username,
      points: points,
      amount: cashValue,
      paymentDetails: userData.paymentDetails,
      status: "pending",
      createdAt: new Date()
    });
    alert(`✅ Withdrawal request for $${cashValue.toFixed(2)} submitted.`);
    renderDashboard();
  }

      <div class="section-title">🏆 Referral Program</div>
      <div class="info-card">🎯 Your referrals: ${userData?.referralCount || 0}</div>
      <div class="info-card">✨ Share your code: <strong>${userData?.referralCode || 'NONE'}</strong></div>
      <div class="info-card">💡 Each friend who signs up with your code gives you 500 points!</div>
      <div class="info-card">📤 Share this link: <strong style="word-break:break-all;">https://ejim-web.github.io/Minute-wealth-/</strong></div>
    `;
  }

  async function renderDashboard() {
    if (!currentUser) { renderAuthScreen(); return; }
    if (!userData) await loadUserData();
    if (!userData) { renderAuthScreen(); return; }

    const transactions = await fetchTransactions();

    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="flex-between">
        <h1>💰 CentLock</h1>
        <button id="logoutBtn" class="btn-outline" style="width: auto; padding: 0.3rem 1rem;">Logout</button>
      </div>
      <div style="font-size: 0.6rem; text-align: center; color: #8aa0bc;">👋 ${userData.username} · ${currentUser.email}</div>
      
      <div class="tabs">
        <div class="tab ${currentTab === 'earn' ? 'active' : ''}" data-tab="earn">💰 Earn</div>
        <div class="tab ${currentTab === 'call' ? 'active' : ''}" data-tab="call">📞 Call</div>
        <div class="tab ${currentTab === 'referral' ? 'active' : ''}" data-tab="referral">👥 Refer</div>
        <div class="tab ${currentTab === 'platforms' ? 'active' : ''}" data-tab="platforms">🌐 Web</div>
      </div>
      
      <div id="tabContent">
        ${currentTab === 'earn' ? renderEarnTab() : 
          currentTab === 'call' ? renderCallTab() :
          currentTab === 'referral' ? renderReferralTab() :
          renderPlatforms()}
      </div>
      
      <div class="info-card">💳 Payment Details (for withdrawal)</div>
      <div class="input-group"><span>🏦</span><input type="text" id="bankName" placeholder="Bank (OPay, GTBank, etc.)" value="${userData?.paymentDetails?.bank || ''}"></div>
      <div class="input-group"><span>🔢</span><input type="text" id="accountNumber" placeholder="Account/Phone Number" value="${userData?.paymentDetails?.accountNumber || ''}"></div>
      <div class="input-group"><span>👤</span><input type="text" id="accountName" placeholder="Full Name" value="${userData?.paymentDetails?.accountName || ''}"></div>
      <button id="savePaymentBtn" class="btn-outline">💾 Save Details</button>
      
      <button id="withdrawBtn" class="btn btn-primary" ${(userData?.points || 0) < MIN_WITHDRAW_POINTS ? 'disabled' : ''}>
        ${(userData?.points || 0) >= MIN_WITHDRAW_POINTS ? `💰 Withdraw $${formatMoney(pointsToCash(userData?.points || 0))}` : `🔒 Need ${MIN_WITHDRAW_POINTS - (userData?.points || 0)} more points`}
      </button>
      
      <hr />
      <div class="flex-between"><span style="font-size: 0.6rem; font-weight: 600;">📜 Recent Activity</span></div>
      <div class="tx-list" id="txList"></div>
    `;

    const txContainer = document.getElementById("txList");
    if (!transactions || transactions.length === 0) txContainer.innerHTML = '<div class="tx-item">✨ No earnings yet. Claim daily check-in!</div>';
    else txContainer.innerHTML = transactions.map(tx => `<div class="tx-item"><span>${tx.type?.toUpperCase() || 'Activity'}</span><span class="positive">+${tx.points || 0} pts</span></div>`).join('');

    // Render contacts in Call tab
    if (currentTab === 'call') {
      const contactsDiv = document.getElementById("contactsList");
      if (contactsDiv) {
        contactsDiv.innerHTML = contacts.map(contact => `
          <div class="contact-card" data-number="${contact.number}">
            <div class="contact-name">${contact.name}</div>
            <div class="contact-number">📞 ${contact.number}</div>
          </div>
        `).join('');
        
        document.querySelectorAll('.contact-card').forEach(card => {
          card.addEventListener('click', () => {
            const number = card.dataset.number;
            makeCall(number);
          });
        });
      }
      
      document.getElementById("callBtn")?.addEventListener('click', () => {
        const number = document.getElementById("callNumber")?.value;
        if (number) makeCall(number);
        else alert("Enter a phone number");
      });
      
      document.getElementById("addContactBtn")?.addEventListener('click', () => {
        const name = document.getElementById("contactName")?.value;
        const number = document.getElementById("contactNumber")?.value;
        if (name && number) {
          contacts.push({ name, number });
          renderDashboard();
        } else {
          alert("Enter both name and number");
        }
      });
    }

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        currentTab = tab.dataset.tab;
        renderDashboard();
      });
    });

    // Platform cards
    document.querySelectorAll('.platform-card').forEach(card => {
      card.addEventListener('click', () => { const url = card.dataset.url; if(url) openUrl(url); });
    });
    document.querySelectorAll('.quick-chip').forEach(chip => {
      chip.addEventListener('click', () => { const url = chip.dataset.url; if(url) openUrl(url); });
    });
    document.getElementById('goUrlBtn')?.addEventListener('click', () => {
      const url = document.getElementById('customUrlInput')?.value;
      if(url) openUrl(url);
    });

    document.getElementById('dailyBtn')?.addEventListener('click', () => claimDaily());
    document.getElementById('savePaymentBtn')?.addEventListener('click', () => {
      const bank = document.getElementById('bankName')?.value;
      const accNum = document.getElementById('accountNumber')?.value;
      const accName = document.getElementById('accountName')?.value;
      if (bank && accNum && accName) savePaymentDetails(bank, accNum, accName);
      else alert("Fill all payment details");
    });
    document.getElementById('withdrawBtn')?.addEventListener('click', () => requestWithdrawal());
    document.getElementById('logoutBtn')?.addEventListener('click', () => signOut());
  }

  function renderAuthScreen() {
    const app = document.getElementById("app");
    app.innerHTML = `
      <h1>💰 CentLock</h1>
      <div class="info-card">📞 Make calls · 📺 Earn points · 🌐 50+ Platforms</div>
      <div class="balance-card"><div style="font-size: 1rem; font-weight: 700;">Welcome to CentLock!</div></div>
      <div class="info-card">🔐 Login</div>
      <div class="input-group"><span>📧</span><input type="email" id="loginEmail" placeholder="Email"></div>
      <div class="input-group"><span>🔒</span><input type="password" id="loginPass" placeholder="Password"></div>
      <button id="loginBtn" class="btn-primary">Login</button>
      <hr>
      <div class="info-card">📝 Create Account (Get 10 bonus points)</div>
      <div class="input-group"><span>📧</span><input type="email" id="regEmail" placeholder="Email"></div>
      <div class="input-group"><span>👤</span><input type="text" id="regUsername" placeholder="Username"></div>
      <div class="input-group"><span>🔒</span><input type="password" id="regPass" placeholder="Password (min 6)"></div>
      <div class="input-group"><span>🔗</span><input type="text" id="regRef" placeholder="Referral code (optional)"></div>
      <button id="registerBtn" class="btn-success">Sign Up</button>
    `;
    document.getElementById("loginBtn")?.addEventListener('click', async () => {
      const email = document.getElementById("loginEmail").value;
      const pwd = document.getElementById("loginPass").value;
      await signIn(email, pwd);
    });
    document.getElementById("registerBtn")?.addEventListener('click', async () => {
      const pwd = document.getElementById("regPass").value;
      if (pwd.length < 6) { alert("Password min 6 characters"); return; }
      await signUp(
        document.getElementById("regEmail").value,
        pwd,
        document.getElementById("regUsername").value,
        document.getElementById("regRef").value
      );
    });
  }

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = { uid: user.uid, email: user.email };
      await loadUserData();
      renderDashboard();
    } else {
      renderAuthScreen();
    }
  });
</script>
</body>
</html>
