<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>CentLock · Earn Real Money</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #0a0f1a; min-height: 100vh; padding: 1rem; display: flex; justify-content: center; align-items: center; }
    .container { max-width: 500px; width: 100%; background: #0f1422; border-radius: 2rem; padding: 1.5rem; border: 1px solid #4CAF50; }
    h1 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #4CAF50, #81C784); -webkit-background-clip: text; background-clip: text; color: transparent; text-align: center; }
    .balance-card { background: linear-gradient(135deg, #1a1f30, #0f1422); border-radius: 1.5rem; padding: 1.2rem; margin: 1rem 0; text-align: center; border: 1px solid #2a2f42; }
    .balance-amount { font-size: 2.8rem; font-weight: 800; color: white; }
    .progress-bar { background: #2a2f42; border-radius: 1rem; height: 8px; margin: 0.8rem 0; overflow: hidden; }
    .progress-fill { background: linear-gradient(90deg, #4CAF50, #81C784); height: 100%; width: 0%; transition: width 0.3s; }
    .stats { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .stat { background: #0f1422; flex: 1; padding: 0.5rem; border-radius: 1rem; text-align: center; }
    .stat-label { font-size: 0.6rem; color: #8aa0bc; text-transform: uppercase; }
    .stat-value { font-size: 1rem; font-weight: 700; color: white; }
    .btn { width: 100%; padding: 0.9rem; border: none; border-radius: 2rem; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin: 0.5rem 0; transition: 0.2s; }
    .btn-ad { background: linear-gradient(135deg, #F57C00, #FFB74D); color: #0a0f1a; }
    .btn-primary { background: linear-gradient(135deg, #2E7D32, #4CAF50); color: white; }
    .btn-outline { background: transparent; border: 1px solid #4CAF50; color: #4CAF50; }
    .btn-danger { background: #dc2626; color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .input-group { background: #0f1422; border-radius: 2rem; padding: 0.3rem 1.2rem; display: flex; gap: 0.5rem; margin: 0.8rem 0; border: 1px solid #2a2f42; }
    .input-group input { background: transparent; border: none; flex: 1; color: white; font-size: 0.9rem; outline: none; }
    .info-card { background: #0f3b5c30; border-left: 3px solid #4CAF50; padding: 0.8rem; border-radius: 1rem; font-size: 0.7rem; color: #C8E6C9; margin: 0.8rem 0; }
    .warning-card { background: #facc1510; border-left: 3px solid #facc15; padding: 0.8rem; border-radius: 1rem; font-size: 0.7rem; color: #fde047; margin: 0.8rem 0; }
    .tx-list { max-height: 200px; overflow-y: auto; margin-top: 0.5rem; }
    .tx-item { background: #0f1422; padding: 0.6rem; border-radius: 1rem; margin-bottom: 0.4rem; display: flex; justify-content: space-between; font-size: 0.7rem; }
    .positive { color: #4ade80; font-weight: 600; }
    .negative { color: #f87171; }
    hr { border-color: #2a2f42; margin: 1rem 0; }
    .admin-card { background: #1a1f30; border-radius: 1rem; padding: 0.8rem; margin-bottom: 0.8rem; }
  </style>
</head>
<body>
<div class="container" id="app">
  <div style="text-align: center; padding: 2rem; color: #8aa0bc;">Loading CentLock...</div>
</div>

<script>
  // ============================================================
  // FIREBASE CONFIGURATION (REPLACE WITH YOUR OWN)
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDiZsP0tcprL1xIhu-sCkGP-4Mfv_Rw9dg",
    authDomain: "joblink-d3d17.firebaseapp.com",
    projectId: "joblink-d3d17",
    storageBucket: "joblink-d3d17.firebasestorage.app",
    messagingSenderId: "462684482263",
    appId: "1:462684482263:web:981dcbe334850ca3fe5e92"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ============================================================
  // APP CONFIGURATION
  // ============================================================
  const AD_URL = "https://publishers.adsterra.com/29627257/";
  const EARN_PER_REQUEST = 0.003;
  const MIN_WITHDRAW = 10.00;

  let currentUser = null;
  let userData = null;

  // ============================================================
  // HELPER FUNCTIONS
  // ============================================================
  function formatMoney(value) {
    return value.toFixed(2);
  }

  // ============================================================
  // AUTHENTICATION
  // ============================================================
  async function signUp(email, password, username) {
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      const uid = cred.user.uid;
      await db.collection("users").doc(uid).set({
        username: username.trim(),
        email: email,
        balance: 0,
        totalEarned: 0,
        totalRequests: 0,
        createdAt: new Date()
      });
      alert("✅ Account created! Please login.");
      return true;
    } catch (err) {
      alert(err.message);
      return false;
    }
  }

  async function signIn(email, password) {
    try {
      await auth.signInWithEmailAndPassword(email, password);
      return true;
    } catch (err) {
      alert(err.message);
      return false;
    }
  }

  async function signOut() {
    await auth.signOut();
    currentUser = null;
    userData = null;
    renderAuthScreen();
  }

  // ============================================================
  // DATA LOADING
  // ============================================================
  async function loadUserData() {
    if (!currentUser) return;
    const doc = await db.collection("users").doc(currentUser.uid).get();
    if (doc.exists) {
      userData = doc.data();
    } else {
      await db.collection("users").doc(currentUser.uid).set({
        username: currentUser.email.split('@')[0],
        email: currentUser.email,
        balance: 0,
        totalEarned: 0,
        totalRequests: 0,
        createdAt: new Date()
      });
      userData = { balance: 0, totalEarned: 0, totalRequests: 0, username: currentUser.email.split('@')[0] };
    }
  }

  async function fetchTransactions() {
    if (!currentUser) return [];
    const snap = await db.collection("users").doc(currentUser.uid).collection("transactions")
      .orderBy("createdAt", "desc")
      .limit(15)
      .get();
    return snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  }

  // ============================================================
  // AD REQUEST SYSTEM
  // ============================================================
  let requestLock = false;
  async function requestAdWatch() {
    if (!currentUser) { alert("Please login first"); return; }
    if (requestLock) { alert("Please wait..."); return; }
    requestLock = true;
    
    window.open(AD_URL, "_blank");
    
    const confirmed = confirm("✅ Did you watch the ad completely? Click OK to submit your request.");
    if (!confirmed) {
      requestLock = false;
      alert("Request cancelled.");
      return;
    }
    
    try {
      const requestRef = db.collection("users").doc(currentUser.uid).collection("requests").doc();
      await requestRef.set({
        amount: EARN_PER_REQUEST,
        status: "pending",
        createdAt: new Date()
      });
      
      await db.collection("users").doc(currentUser.uid).update({
        totalRequests: (userData.totalRequests || 0) + 1
      });
      userData.totalRequests = (userData.totalRequests || 0) + 1;
      
      alert("✅ Request submitted! Admin will review within 24-48 hours.");
      renderDashboard();
    } catch (err) {
      alert("Error: " + err.message);
    } finally {
      requestLock = false;
    }
  }

  // ============================================================
  // WITHDRAWAL SYSTEM
  // ============================================================
  async function requestWithdrawal() {
    if (!currentUser) return;
    const balance = userData?.balance || 0;
    if (balance < MIN_WITHDRAW) {
      alert(`Minimum withdrawal is $${MIN_WITHDRAW}. Need $${(MIN_WITHDRAW - balance).toFixed(2)} more.`);
      return;
    }
    
    const pending = await db.collection("withdrawalRequests")
      .where("userId", "==", currentUser.uid)
      .where("status", "==", "pending")
      .get();
    
    if (!pending.empty) {
      alert("You already have a pending withdrawal request.");
      return;
    }
    
    try {
      await db.collection("withdrawalRequests").add({
        userId: currentUser.uid,
        username: userData.username,
        amount: balance,
        status: "pending",
        createdAt: new Date()
      });
      alert(`✅ Withdrawal request for $${balance.toFixed(2)} submitted. Admin will review and pay.`);
      renderDashboard();
    } catch (err) {
      alert("Error: " + err.message);
    }
  }

  // ============================================================
  // RENDER FUNCTIONS
  // ============================================================
  async function renderDashboard() {
    if (!currentUser || !userData) return;
    
    const balance = userData.balance || 0;
    const totalEarned = userData.totalEarned || 0;
    const totalRequests = userData.totalRequests || 0;
    const progress = Math.min((balance / MIN_WITHDRAW) * 100, 100);
    const transactions = await fetchTransactions();
    
    const app = document.getElementById("app");
    app.innerHTML = `
      <h1>💰 CentLock</h1>
      <div style="font-size: 0.7rem; text-align: center; color: #8aa0bc; margin-bottom: 0.5rem;">👋 ${userData.username} · ${currentUser.email}</div>
      
      <div class="balance-card">
        <div class="balance-amount">$${formatMoney(balance)}</div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%;"></div></div>
        <div class="stats">
          <div class="stat"><div class="stat-label">GOAL</div><div class="stat-value">$${MIN_WITHDRAW}</div></div>
          <div class="stat"><div class="stat-label">REQUESTS</div><div class="stat-value">${totalRequests}</div></div>
          <div class="stat"><div class="stat-label">EARNED</div><div class="stat-value">$${formatMoney(totalEarned)}</div></div>
        </div>
      </div>
      
      <button id="watchBtn" class="btn btn-ad">🎬 Watch Ad & Earn (${EARN_PER_REQUEST * 100}¢)</button>
      <button id="withdrawBtn" class="btn btn-primary" ${balance < MIN_WITHDRAW ? 'disabled' : ''}>
        ${balance >= MIN_WITHDRAW ? `💰 Withdraw $${formatMoney(balance)}` : `🔒 Need $${(MIN_WITHDRAW - balance).toFixed(2)} more`}
      </button>
      
      <div class="info-card">
        🔒 <strong>How It Works:</strong><br>
        1. Watch ad → Submit request<br>
        2. Admin reviews (24-48 hours)<br>
        3. Balance increases after approval<br>
        4. Withdraw at $${MIN_WITHDRAW}
      </div>
      
      <hr>
      <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
        <span style="font-size: 0.7rem; font-weight: 600;">📜 Recent Activity</span>
        <span style="font-size: 0.6rem; color: #8aa0bc;">Manual approval</span>
      </div>
      <div class="tx-list" id="txList"></div>
      
      <button id="logoutBtn" class="btn-outline" style="margin-top: 1rem;">Logout</button>
    `;
    
    const txContainer = document.getElementById("txList");
    if (transactions.length === 0) {
      txContainer.innerHTML = '<div class="tx-item">✨ No transactions yet</div>';
    } else {
      txContainer.innerHTML = transactions.map(tx => `
        <div class="tx-item">
          <span>${tx.type?.toUpperCase() || ''} ${tx.note || ''}</span>
          <span class="${tx.amount > 0 ? 'positive' : 'negative'}">${tx.amount > 0 ? '+' : ''}$${Math.abs(tx.amount).toFixed(4)}</span>
        </div>
      `).join('');
    }
    
    document.getElementById("watchBtn")?.addEventListener("click", requestAdWatch);
    document.getElementById("withdrawBtn")?.addEventListener("click", requestWithdrawal);
    document.getElementById("logoutBtn")?.addEventListener("click", signOut);
  }

  function renderAuthScreen() {
    const app = document.getElementById("app");
    app.innerHTML = `
      <h1>💰 CentLock</h1>
      <div class="info-card" style="margin-top: 0.5rem;">Earn money by watching ads · Withdraw at $${MIN_WITHDRAW}</div>
      
      <div class="balance-card">
        <div style="font-size: 1.2rem; font-weight: 700;">Welcome!</div>
        <div class="stats" style="margin-top: 0.5rem;">
          <div class="stat"><div class="stat-label">EARN</div><div class="stat-value">$${EARN_PER_REQUEST}/ad</div></div>
          <div class="stat"><div class="stat-label">MIN</div><div class="stat-value">$${MIN_WITHDRAW}</div></div>
        </div>
      </div>
      
      <div class="info-card">🔐 Login</div>
      <div class="input-group"><span>📧</span><input type="email" id="loginEmail" placeholder="Email"></div>
      <div class="input-group"><span>🔒</span><input type="password" id="loginPass" placeholder="Password"></div>
      <button id="loginBtn" class="btn-primary">Login</button>
      
      <hr>
      
      <div class="info-card">📝 Create Account</div>
      <div class="input-group"><span>📧</span><input type="email" id="regEmail" placeholder="Email"></div>
      <div class="input-group"><span>👤</span><input type="text" id="regUsername" placeholder="Username"></div>
      <div class="input-group"><span>🔒</span><input type="password" id="regPass" placeholder="Password (min 6)"></div>
      <button id="registerBtn" class="btn-outline">Sign Up</button>
      
      <div class="warning-card" style="margin-top: 1rem;">
        💡 Admin manually reviews and credits all ad requests.
      </div>
    `;
    
    document.getElementById("loginBtn")?.addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value;
      const pwd = document.getElementById("loginPass").value;
      if (await signIn(email, pwd)) {
        currentUser = auth.currentUser;
        await loadUserData();
        renderDashboard();
      }
    });
    
    document.getElementById("registerBtn")?.addEventListener("click", async () => {
      const email = document.getElementById("regEmail").value;
      const username = document.getElementById("regUsername").value;
      const pwd = document.getElementById("regPass").value;
      if (pwd.length < 6) { alert("Password must be at least 6 characters"); return; }
      await signUp(email, pwd, username);
    });
  }

  // ============================================================
  // AUTH STATE LISTENER
  // ============================================================
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      await loadUserData();
      renderDashboard();
    } else {
      currentUser = null;
      userData = null;
      renderAuthScreen();
    }
  });
</script>
</body>
</html>
