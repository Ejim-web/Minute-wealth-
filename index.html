  function openUrl(url) {
    if (!url) return;
    let finalUrl = url.trim();
    if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
      finalUrl = 'https://' + finalUrl;
    }
    try { 
      new URL(finalUrl); 
      window.open(finalUrl, '_blank'); 
    } catch(e) { alert('Invalid URL'); }
  }

  function formatPoints(p) { return p ? p.toFixed(0) : "0"; }
  function formatMoney(v) { return v ? v.toFixed(2) : "0.00"; }
  function pointsToCash(points) { return (points / POINTS_FOR_5_DOLLARS) * 5; }

  // ============================================================
  // DAILY CHECK-IN
  // ============================================================
  async function claimDaily() {
    if (!currentUser || !userData) { alert("Please login first"); return; }
    if (todayClaimed) { alert("You already claimed today's reward!"); return; }
    
    const today = new Date().toISOString().split('T')[0];
    const userRef = db.collection("users").doc(currentUser.uid);
    const claimRef = userRef.collection("dailyClaims").doc(today);
    
    try {
      await db.runTransaction(async (transaction) => {
        const claimDoc = await transaction.get(claimRef);
        if (claimDoc.exists) throw new Error("Already claimed today");
        transaction.set(claimRef, { claimedAt: firebase.firestore.FieldValue.serverTimestamp() });
        transaction.update(userRef, {
          points: firebase.firestore.FieldValue.increment(DAILY_REWARD),
          totalPoints: firebase.firestore.FieldValue.increment(DAILY_REWARD)
        });
      });
      await loadUserData();
      todayClaimed = true;
      alert(`🎉 +${DAILY_REWARD} points for daily check-in!`);
      renderDashboard();
    } catch (error) { alert(error.message); }
  }

  // ============================================================
  // REFERRAL SYSTEM
  // ============================================================
  async function signUp(email, password, username, referralCode) {
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      const uid = cred.user.uid;
      let referrerBonus = 0;
      let referredBy = null;
      if (referralCode && referralCode.trim()) {
        const referrers = await db.collection("users").where("referralCode", "==", referralCode.trim().toUpperCase()).get();
        if (!referrers.empty) {
          const referrer = referrers.docs[0];
          referredBy = referrer.id;
          await db.collection("users").doc(referredBy).update({
            points: firebase.firestore.FieldValue.increment(REFERRAL_REWARD),
            totalPoints: firebase.firestore.FieldValue.increment(REFERRAL_REWARD)
          });
          referrerBonus = REFERRAL_REWARD;
        }
      }
      const userRef = db.collection("users").doc(uid);
      await userRef.set({
        username: username.trim(),
        email: email,
        points: 10,
        totalPoints: 10,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        pendingWithdrawal: null,
        paymentDetails: null,
        referralCode: generateReferralCode(email),
        referredBy: referredBy
      });
      alert(`✅ Account created! You got 10 bonus points. ${referrerBonus > 0 ? `Your referrer got ${REFERRAL_REWARD} points!` : "Share your code to earn points!"}`);
      return true;
    } catch (err) { alert(err.message); return false; }
  }

  function generateReferralCode(email) {
    const prefix = email.split('@')[0].slice(0,4).toUpperCase();
    const random = Math.random().toString(36).substring(2,6).toUpperCase();
    return `${prefix}${random}`;
  }

  // ============================================================

  async function requestBonusTask() {
    if (!currentUser || !userData) { alert("Please login first"); return; }
    
    const oneDayAgo = new Date(Date.now() - BONUS_REQUEST_COOLDOWN_MS);
    const recentRequests = await db.collection("bonusRequests")
      .where("userId", "==", currentUser.uid)
      .where("createdAt", ">=", oneDayAgo)
      .get();
    if (recentRequests.size >= 3) {
      alert("You have reached the maximum bonus requests for today (3). Please try again tomorrow.");
      return;
    }
    const bonusRef = db.collection("bonusRequests").doc();
    await bonusRef.set({
      userId: currentUser.uid,
      username: userData.username,
      requestedPoints: 10,
      status: "pending",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    alert("✅ Bonus request submitted! Admin will review and award points manually.");
  }

  // ============================================================
  // AUTHENTICATION
  // ============================================================
  async function signIn(email, password) {
    if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
      currentUser = { isAdmin: true, email: email, uid: "admin" };
      renderDashboard();
      return true;
    }
    try {
      const userCred = await auth.signInWithEmailAndPassword(email, password);
      currentUser = { uid: userCred.user.uid, email: userCred.user.email, isAdmin: false };
      await loadUserData();
      renderDashboard();
      return true;
    } catch (err) { alert(err.message); return false; }
  }

  async function signOut() {
    await auth.signOut();
    currentUser = null; userData = null;
    renderAuthScreen();
  }

  async function loadUserData() {
    if (!currentUser || currentUser.isAdmin) return;
    const doc = await db.collection("users").doc(currentUser.uid).get();
    if (doc.exists) {
      userData = doc.data();
      const today = new Date().toISOString().split('T')[0];
      const claimDoc = await db.collection("users").doc(currentUser.uid).collection("dailyClaims").doc(today).get();
      todayClaimed = claimDoc.exists;
    } else {
      userData = { points: 0, totalPoints: 0, username: currentUser.email.split('@')[0], referralCode: "NONE" };
    }
  }

  async function fetchTransactions() {
    if (!currentUser || currentUser.isAdmin) return [];
    const snap = await db.collection("users").doc(currentUser.uid).collection("transactions").orderBy("createdAt", "desc").limit(10).get();
    return snap.docs.map(d => d.data());
  }

  async function savePaymentDetails(bank, accountNumber, accountName) {
    if (!bank || !accountNumber || !accountName) { alert("All payment fields are required"); return; }
    await db.collection("users").doc(currentUser.uid).update({
      paymentDetails: { bank: bank.trim(), accountNumber: accountNumber.trim(), accountName: accountName.trim(), updatedAt: new Date() }
    });
    userData.paymentDetails = { bank, accountNumber, accountName };
    alert("✅ Payment details saved!");
    renderDashboard();
  }

  async function requestWithdrawal() {
    if (!currentUser || currentUser.isAdmin) return;
    const points = userData?.points || 0;
    if (points < MIN_WITHDRAW_POINTS) {
      alert(`Need ${MIN_WITHDRAW_POINTS - points} more points. Minimum ${MIN_WITHDRAW_POINTS} points = $5.00`);
      return;
    }
    const paymentDetails = userData?.paymentDetails;
    if (!paymentDetails) { alert("❌ Please add your payment details first"); return; }
    if (userData.lastWithdrawalDate) {
      const lastDate = userData.lastWithdrawalDate.toDate();
      const daysDiff = (Date.now() - lastDate.getTime()) / (1000 * 60 * 60 * 24);
      if (daysDiff < WITHDRAW_COOLDOWN_DAYS) {
        alert(`You can request withdrawal once every ${WITHDRAW_COOLDOWN_DAYS} days. Please wait.`);
        return;
      }
    }
    const pending = await db.collection("withdrawalRequests").where("userId", "==", currentUser.uid).where("status", "==", "pending").get();
    if (!pending.empty) { alert("You already have a pending request."); return; }
    const cashValue = pointsToCash(points);
    await db.collection("withdrawalRequests").add({
      userId: currentUser.uid,
      username: userData.username,
      points: points,
      amount: cashValue,
      paymentDetails: paymentDetails,
      status: "pending",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection("users").doc(currentUser.uid).update({ lastWithdrawalDate: new Date() });
    alert(`✅ Withdrawal request for ${points} points ($${cashValue.toFixed(2)}) submitted. Admin will review.`);
    renderDashboard();
  }

  async function getPendingWithdrawals() {
    const snap = await db.collection("withdrawalRequests").where("status", "==", "pending").get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
  async function getPendingBonusRequests() {
    const snap = await db.collection("bonusRequests").where("status", "==", "pending").get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
  async function approveWithdrawal(requestId, amount) {
    await db.collection("withdrawalRequests").doc(requestId).update({ status: "approved", approvedAt: new Date() });
    alert(`✅ Withdrawal approved for $${amount.toFixed(2)}. Send payment to user.`);
    renderDashboard();
  }
  async function rejectWithdrawal(requestId) {
    await db.collection("withdrawalRequests").doc(requestId).update({ status: "rejected", rejectedAt: new Date() });
    alert("❌ Withdrawal rejected.");
    renderDashboard();
  }
  async function approveBonus(requestId, userId, points) {
    await db.collection("bonusRequests").doc(requestId).update({ status: "approved", approvedAt: new Date() });
    await db.collection("users").doc(userId).update({
      points: firebase.firestore.FieldValue.increment(points),
      totalPoints: firebase.firestore.FieldValue.increment(points)
    });
    alert(`✅ Bonus approved: +${points} points awarded.`);
    renderDashboard();
  }
  async function rejectBonus(requestId) {
    await db.collection("bonusRequests").doc(requestId).update({ status: "rejected", rejectedAt: new Date() });
    alert("❌ Bonus request rejected.");
    renderDashboard();
  }

      html += `<div class="section-title">${category}</div>`;
      html += `<div class="platform-grid">`;
      platforms.forEach(p => {
        html += `<div class="platform-card" data-url="${p.url}"><div class="platform-icon">${p.icon}</div><div class="platform-name">${p.name}</div></div>`;
      });
      html += `</div>`;
    }
    return html;
  }

            <div>Account: ${req.paymentDetails?.accountNumber || 'N/A'}</div>
            <div class="flex-between" style="margin-top: 0.5rem;">
              <button id="approveWd_${req.id}" class="btn-primary" style="flex:1; margin-right:0.3rem;">✅ Approve</button>
              <button id="rejectWd_${req.id}" class="btn-danger" style="flex:1;">❌ Reject</button>
            </div>
          </div>
        `).join('');
        for (const req of pendingWithdrawals) {
          document.getElementById(`approveWd_${req.id}`)?.addEventListener('click', () => approveWithdrawal(req.id, req.amount));
          document.getElementById(`rejectWd_${req.id}`)?.addEventListener('click', () => rejectWithdrawal(req.id));
        }
      }
      const bonusDiv = document.getElementById("bonusList");
      if (pendingBonuses.length === 0) bonusDiv.innerHTML = '<div class="info-card">✅ No pending bonus requests</div>';
      else {
        bonusDiv.innerHTML = pendingBonuses.map(req => `
          <div class="task-card">
            <div><strong>${req.username}</strong> (${req.userId})</div>
            <div>Requested: +${req.requestedPoints} points</div>
            <div class="flex-between" style="margin-top: 0.5rem;">
              <button id="approveBonus_${req.id}" class="btn-primary" style="flex:1; margin-right:0.3rem;">✅ Approve</button>
              <button id="rejectBonus_${req.id}" class="btn-danger" style="flex:1;">❌ Reject</button>
            </div>
          </div>
        `).join('');
        for (const req of pendingBonuses) {
          document.getElementById(`approveBonus_${req.id}`)?.addEventListener('click', () => approveBonus(req.id, req.userId, req.requestedPoints));
          document.getElementById(`rejectBonus_${req.id}`)?.addEventListener('click', () => rejectBonus(req.id));
        }
      }
      document.getElementById("logoutBtn")?.addEventListener('click', () => signOut());
      return;
    }

    // Regular user dashboard
    if (!currentUser) { renderAuthScreen(); return; }
    if (!userData) await loadUserData();
    if (!userData) { renderAuthScreen(); return; }

    const points = userData.points || 0;
    const totalPoints = userData.totalPoints || 0;
    const cashValue = pointsToCash(points);
    const progress = Math.min((points / MIN_WITHDRAW_POINTS) * 100, 100);
    const paymentDetails = userData.paymentDetails;
    const referralCode = userData.referralCode || "CENTLOCK";
    const canWithdraw = points >= MIN_WITHDRAW_POINTS;
    const transactions = await fetchTransactions();

    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="flex-between">
        <h1>💰 CentLock</h1>
        <button id="logoutBtn" class="btn-outline" style="width: auto; padding: 0.3rem 1rem;">Logout</button>
      </div>
      <div style="font-size: 0.6rem; text-align: center; color: #8aa0bc;">👋 ${userData.username || 'User'} · ${currentUser.email}</div>
      <div class="balance-card">
        <div class="balance-amount">${formatPoints(points)} Points</div>
        <div style="font-size: 0.7rem; color: #4ade80;">≈ $${formatMoney(cashValue)} USD</div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%;"></div></div>
        <div class="stats">
          <div class="stat"><div class="stat-label">GOAL</div><div class="stat-value">${MIN_WITHDRAW_POINTS} pts</div></div>
          <div class="stat"><div class="stat-label">TOTAL</div><div class="stat-value">${formatPoints(totalPoints)}</div></div>
        </div>
      </div>
      <div class="task-card">
        <div><div class="task-name">📅 Daily Check‑in</div><div class="task-reward">+${DAILY_REWARD} points</div></div>
        <button id="dailyBtn" class="task-btn" ${todayClaimed ? 'disabled' : ''}>${todayClaimed ? '✓ Claimed Today' : 'Claim'}</button>
      </div>
      <div class="task-card">
        <div><div class="task-name">✨ Bonus Points Request</div><div class="task-reward">Request +10 points</div></div>
        <button id="bonusBtn" class="task-btn">Request Bonus</button>
      </div>
      <div class="info-card">🔗 <strong>Your Referral Code:</strong> <span style="font-family: monospace;">${referralCode}</span><br>Share this code! You get ${REFERRAL_REWARD} points per referral.</div>
      ${renderPlatforms()}
      <div class="info-card">💳 Payment Details</div>
      <div class="input-group"><span>🏦</span><input type="text" id="bankName" placeholder="Bank (OPay, GTBank, etc.)" value="${paymentDetails?.bank || ''}"></div>
      <div class="input-group"><span>🔢</span><input type="text" id="accountNumber" placeholder="Account/Phone Number" value="${paymentDetails?.accountNumber || ''}"></div>
      <div class="input-group"><span>👤</span><input type="text" id="accountName" placeholder="Full Name" value="${paymentDetails?.accountName || ''}"></div>
      <button id="savePaymentBtn" class="btn-outline">💾 Save Details</button>
      <button id="withdrawBtn" class="btn btn-primary" ${!canWithdraw ? 'disabled' : ''}>
        ${canWithdraw ? `💰 Withdraw $${formatMoney(cashValue)}` : `🔒 Need ${MIN_WITHDRAW_POINTS - points} more points`}
      </button>
      <hr />
      <div class="flex-between"><span style="font-size: 0.6rem; font-weight: 600;">📜 Recent Activity</span></div>
      <div class="tx-list" id="txList"></div>
    `;

    const txContainer = document.getElementById("txList");
    if (!transactions || transactions.length === 0) txContainer.innerHTML = '<div class="tx-item">✨ No earnings yet. Claim daily or refer friends!</div>';
    else txContainer.innerHTML = transactions.map(tx => `<div class="tx-item"><span>${tx.type?.toUpperCase() || 'Activity'}</span><span class="positive">+${tx.points || 0} pts</span></div>`).join('');

    document.querySelectorAll('.platform-card').forEach(card => {
      card.addEventListener('click', () => { 
        const url = card.dataset.url; 
        if(url) openUrl(url); 
      });
    });
    document.getElementById('goUrlBtn')?.addEventListener('click', () => {
      const url = document.getElementById('customUrlInput')?.value;
      if(url) openUrl(url);
    });
    document.getElementById('dailyBtn')?.addEventListener('click', () => claimDaily());
    document.getElementById('bonusBtn')?.addEventListener('click', () => requestBonusTask());
    document.getElementById('savePaymentBtn')?.addEventListener('click', () => {
      const bank = document.getElementById('bankName')?.value;
      const accNum = document.getElementById('accountNumber')?.value;
      const accName = document.getElementById('accountName')?.value;
      if (bank && accNum && accName) savePaymentDetails(bank, accNum, accName);
      else alert("Please fill all payment details");
    });
    document.getElementById('withdrawBtn')?.addEventListener('click', () => requestWithdrawal());
    document.getElementById('logoutBtn')?.addEventListener('click', () => signOut());
  }

  function renderAuthScreen() {
    const app = document.getElementById("app");
    app.innerHTML = `
      <h1>💰 CentLock</h1>
      <div class="info-card">Earn points: Daily check‑in · Referrals · Bonus requests</div>
      <div class="balance-card"><div style="font-size: 1rem; font-weight: 700;">Welcome!</div></div>
      <div class="info-card">🔐 Login</div>
      <div class="input-group"><span>📧</span><input type="email" id="loginEmail" placeholder="Email"></div>
      <div class="input-group"><span>🔒</span><input type="password" id="loginPass" placeholder="Password"></div>
      <button id="loginBtn" class="btn-primary">Login</button>
      <hr>
      <div class="info-card">📝 Create Account (Get 10 bonus points)</div>
      <div class="input-group"><span>📧</span><input type="email" id="regEmail" placeholder="Email"></div>
      <div class="input-group"><span>👤</span><input type="text" id="regUsername" placeholder="Username"></div>
      <div class="input-group"><span>🔒</span><input type="password" id="regPass" placeholder="Password (min 6)"></div>
      <div class="input-group"><span>🔗</span><input type="text" id="regRef" placeholder="Referral code (optional)"></div>
      <button id="registerBtn" class="btn-success">Sign Up</button>
    `;
    document.getElementById("loginBtn")?.addEventListener('click', async () => {
      const email = document.getElementById("loginEmail").value;
      const pwd = document.getElementById("loginPass").value;
      await signIn(email, pwd);
    });
    document.getElementById("registerBtn")?.addEventListener('click', async () => {
      const pwd = document.getElementById("regPass").value;
      if (pwd.length < 6) { alert("Password min 6 characters"); return; }
      await signUp(
        document.getElementById("regEmail").value,
        pwd,
        document.getElementById("regUsername").value,
        document.getElementById("regRef").value
      );
    });
  }

  // Firebase auth state listener
  auth.onAuthStateChanged(async (user) => {
    if (user && !currentUser?.isAdmin) {
      currentUser = { uid: user.uid, email: user.email, isAdmin: false };
      await loadUserData();
      renderDashboard();
    } else if (!currentUser?.isAdmin) {
      renderAuthScreen();
    }
  });
</script>
</body>
</html>
