  function openUrl(url) {
    if (!url) return;
    let finalUrl = url.trim();
    if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
      finalUrl = 'https://' + finalUrl;
    }
    try { new URL(finalUrl); window.open(finalUrl, '_blank'); } catch(e) { alert('Invalid URL'); }
  }

  function showToast(message, duration = 3000) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), duration);
  }

  function copyToClipboard(text) {
    navigator.clipboard.writeText(text);
    showToast("Copied! 📋", 1000);
  }

  async function canShowAd() {
    if (!currentUser) return false;
    const lastAd = userData?.lastAdTime;
    if (!lastAd) return true;
    const lastAdDate = lastAd.toDate ? lastAd.toDate() : new Date(lastAd);
    const hoursSince = (Date.now() - lastAdDate.getTime()) / (1000 * 60 * 60);
    return hoursSince >= AD_INTERVAL_HOURS;
  }

  function getTimeUntilNextAd() {
    if (!userData?.lastAdTime) return null;
    const lastAdDate = userData.lastAdTime.toDate ? userData.lastAdTime.toDate() : new Date(userData.lastAdTime);
    const nextAdTime = new Date(lastAdDate.getTime() + (AD_INTERVAL_HOURS * 60 * 60 * 1000));
    const now = Date.now();
    if (now >= nextAdTime.getTime()) return null;
    const hoursLeft = Math.floor((nextAdTime.getTime() - now) / (1000 * 60 * 60));
    const minutesLeft = Math.floor(((nextAdTime.getTime() - now) % (1000 * 60 * 60)) / (1000 * 60));
    return { hours: hoursLeft, minutes: minutesLeft };
  }

    }
    const lastAdDate = userData.lastAdTime.toDate ? userData.lastAdTime.toDate() : new Date(userData.lastAdTime);
    const nextAdTime = new Date(lastAdDate.getTime() + (AD_INTERVAL_HOURS * 60 * 60 * 1000));
    const now = Date.now();
    if (now >= nextAdTime.getTime()) {
      timerDiv.innerHTML = '<span class="timer-text">📺 Ad ready! Click "Watch Ad" to earn</span>';
      return;
    }
    const hoursLeft = Math.floor((nextAdTime.getTime() - now) / (1000 * 60 * 60));
    const minutesLeft = Math.floor(((nextAdTime.getTime() - now) % (1000 * 60 * 60)) / (1000 * 60));
    timerDiv.innerHTML = `<span class="timer-text">⏰ Next ad available in: </span><span class="timer-count">${hoursLeft}h ${minutesLeft}m</span>`;
  }

  async function addTransaction(userId, type, points, note) {
    await db.collection('users').doc(userId).collection('transactions').add({
      type, points, note, date: new Date()
    });
  }

  async function watchAd() {
    if (!currentUser) { alert("Login first"); return; }
    const eligible = await canShowAd();
    if (!eligible) {
      const timeLeft = getTimeUntilNextAd();
      if (timeLeft) alert(`Please wait ${timeLeft.hours}h ${timeLeft.minutes}m before watching another ad.`);
      else alert("Please wait before watching another ad.");
      return;
    }
    
    window.open('https://omg10.com/4/11140123', '_blank');
    showToast("📺 Ad opened! You'll earn +" + AD_REWARD_POINTS + " points.", 3000);
    
    setTimeout(async () => {
      await db.collection('users').doc(currentUser.uid).update({
        lastAdTime: new Date(),
        points: firebase.firestore.FieldValue.increment(AD_REWARD_POINTS),
        totalPoints: firebase.firestore.FieldValue.increment(AD_REWARD_POINTS),
        adsWatched: firebase.firestore.FieldValue.increment(1)
      });
      await addTransaction(currentUser.uid, 'ad_reward', AD_REWARD_POINTS, 'User watched ad');
      await loadUserData();
      renderApp();
      showToast(`✅ +${AD_REWARD_POINTS} points! Next ad in ${AD_INTERVAL_HOURS} hours.`, 3000);
    }, 5000);
  }

  async function openSmartLink() {
    if (!currentUser) { alert("Please login first"); return; }
    window.open('https://omg10.com/4/11140123', '_blank');
    await db.collection('users').doc(currentUser.uid).update({
      points: firebase.firestore.FieldValue.increment(1)
    });
    await loadUserData();
    showToast("🎁 +1 bonus point!", 2000);
    renderApp();
  }

  async function claimDaily() {
    if (!currentUser) { alert("Login first"); return; }
    const today = new Date().toISOString().split('T')[0];
    const claimRef = db.collection('users').doc(currentUser.uid).collection('dailyClaims').doc(today);
    const claimDoc = await claimRef.get();
    if (claimDoc.exists) { alert("Already claimed today!"); return; }
    
    const userRef = db.collection('users').doc(currentUser.uid);
    const userDoc = await userRef.get();
    const userDataDoc = userDoc.data();
    let streak = userDataDoc.streak || 0;
    const lastClaim = userDataDoc.lastDailyClaim;
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayStr = yesterday.toISOString().split('T')[0];
    if (lastClaim === yesterdayStr) streak++;
    else if (lastClaim !== today) streak = 1;
    let reward = DAILY_REWARD;
    if (streak >= 30) reward = 100;
    else if (streak >= 14) reward = 50;
    else if (streak >= 7) reward = 25;
    else if (streak >= 3) reward = 10;
    
    await claimRef.set({ date: today });
    await userRef.update({
      points: firebase.firestore.FieldValue.increment(reward),
      totalPoints: firebase.firestore.FieldValue.increment(reward),
      streak: streak,
      lastDailyClaim: today
    });
    await addTransaction(currentUser.uid, 'daily_checkin', reward, `Day ${streak} streak!`);
    await loadUserData();
    alert(`🎉 +${reward} points! ${streak} day streak!`);
    renderApp();
  }

  async function requestWithdrawal() {
    if (!currentUser) return alert("Login first");
    if (!userData?.paymentDetails) return alert("Add payment details first");
    if ((userData?.points || 0) < POINTS_FOR_5_DOLLARS) {
      alert(`Need ${POINTS_FOR_5_DOLLARS - (userData?.points || 0)} more points`);
      return;
    }
    const cashAmount = (userData.points / POINTS_FOR_5_DOLLARS) * 5;
    await db.collection('withdrawalRequests').add({
      userId: currentUser.uid,
      username: userData.username,
      points: userData.points,
      amount: cashAmount,
      paymentDetails: userData.paymentDetails,
      status: "pending",
      date: new Date()
    });
    alert(`✅ Withdrawal request for $${cashAmount.toFixed(2)} submitted. Admin will review.`);
    renderApp();
  }

  async function savePaymentDetails() {
    const bank = document.getElementById('bankName').value;
    const account = document.getElementById('accountNumber').value;
    const name = document.getElementById('accountName').value;
    if (!bank || !account || !name) return alert("Fill all fields");
    await db.collection('users').doc(currentUser.uid).update({
      paymentDetails: { bank, account, name }
    });
    await loadUserData();
    alert("✅ Payment details saved!");
    renderApp();
  }

  async function signUp(email, password, username) {
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      await db.collection('users').doc(cred.user.uid).set({
        username: username,
        email: email,
        points: 10,
        totalPoints: 10,
        streak: 0,
        adsWatched: 0,
        lastAdTime: null,
        referralCode: username.slice(0,4).toUpperCase() + Math.random().toString(36).substring(2,6).toUpperCase(),
        createdAt: new Date()
      });
      alert("Account created! +10 bonus points");
      return true;
    } catch(err) { alert(err.message); return false; }
  }

  async function signIn(email, password) {
    try {
      await auth.signInWithEmailAndPassword(email, password);
      currentUser = auth.currentUser;
      isAdmin = (currentUser.email === ADMIN_EMAIL);
      await loadUserData();
      renderApp();
      return true;
    } catch(err) { alert(err.message); return false; }
  }

  async function signOut() {
    await auth.signOut();
    currentUser = null;
    renderApp();
  }

  async function loadUserData() {
    if (!currentUser) return;
    const doc = await db.collection('users').doc(currentUser.uid).get();
    if (doc.exists) {
      userData = doc.data();
      const today = new Date().toISOString().split('T')[0];
      const claimDoc = await db.collection('users').doc(currentUser.uid).collection('dailyClaims').doc(today).get();
      userData.hasClaimedDaily = claimDoc.exists;
    }
  }

  async function getPendingWithdrawals() {
    const snap = await db.collection('withdrawalRequests').where('status', '==', 'pending').get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }

  async function approveWithdrawal(id, userId, points) {
    await db.collection('withdrawalRequests').doc(id).update({ status: 'approved', approvedAt: new Date() });
    await db.collection('users').doc(userId).update({ points: 0 });
    alert("✅ Withdrawal approved. Send money to user.");
    renderApp();
  }

  async function rejectWithdrawal(id) {
    await db.collection('withdrawalRequests').doc(id).update({ status: 'rejected' });
    alert("❌ Withdrawal rejected.");
    renderApp();
  }

  async function completeTrivia(reward) {
    await db.collection('users').doc(currentUser.uid).update({
      points: firebase.firestore.FieldValue.increment(reward),
      totalPoints: firebase.firestore.FieldValue.increment(reward)
    });
    await loadUserData();
    showToast(`🎮 +${reward} points for trivia!`, 3000);
    renderApp();
  }

  // ============================================================
  // MAIN RENDER FUNCTION
  // ============================================================
  async function renderApp() {
    const app = document.getElementById("app");
    
    if (!currentUser) {
      app.innerHTML = `
        <h1>💰 CentLock</h1>
        <div class="info">Earn points, track crypto, learn trivia & more!</div>
        <div class="balance"><h2>Welcome!</h2></div>
        <div class="info">🔐 Login</div>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPass" placeholder="Password">
        <button id="loginBtn" class="btn-daily">Login</button>
        <hr style="margin:1rem 0">
        <div class="info">📝 Sign Up (Get 10 free points)</div>
        <input type="email" id="regEmail" placeholder="Email">
        <input type="text" id="regUser" placeholder="Username">
        <input type="password" id="regPass" placeholder="Password (min 6)">
        <button id="registerBtn" class="btn-outline">Sign Up</button>
        <div class="info">📺 Watch ads, claim daily rewards, and earn points!</div>
      `;
      document.getElementById("loginBtn")?.addEventListener('click', () => {
        signIn(document.getElementById("loginEmail").value, document.getElementById("loginPass").value);
      });
      document.getElementById("registerBtn")?.addEventListener('click', async () => {
        const pwd = document.getElementById("regPass").value;
        if (pwd.length < 6) { alert("Password min 6 characters"); return; }
        await signUp(document.getElementById("regEmail").value, pwd, document.getElementById("regUser").value);
      });
      return;
    }
    
    // Admin Panel
    if (isAdmin) {
      const pending = await getPendingWithdrawals();
      app.innerHTML = `
        <h1>👑 CentLock Admin</h1>
        <button id="logoutBtn" class="btn-outline" style="margin-bottom:1rem;">Logout</button>
        <div class="balance"><h2>${pending.length}</h2><div>Pending Withdrawals</div></div>
        <div id="pendingList"></div>
      `;
      const listDiv = document.getElementById("pendingList");
      if (pending.length === 0) {
        listDiv.innerHTML = '<div class="info">✅ No pending withdrawals</div>';
      } else {
        listDiv.innerHTML = pending.map(req => `
          <div class="admin-card">
            <div><strong>${req.username}</strong></div>
            <div>Amount: <span class="green">$${req.amount?.toFixed(2)}</span> (${req.points} pts)</div>
            <div>Bank: ${req.paymentDetails?.bank || 'N/A'}</div>
            <div>Account: ${req.paymentDetails?.accountNumber || 'N/A'}</div>
            <div class="flex" style="margin-top:0.5rem;">
              <button id="approve_${req.id}" class="btn-daily" style="flex:1; margin-right:0.3rem;">✅ Approve</button>
              <button id="reject_${req.id}" class="btn-outline" style="flex:1;">❌ Reject</button>
            </div>
          </div>
        `).join('');
        for (const req of pending) {
          document.getElementById(`approve_${req.id}`)?.addEventListener('click', () => approveWithdrawal(req.id, req.userId, req.points));
          document.getElementById(`reject_${req.id}`)?.addEventListener('click', () => rejectWithdrawal(req.id));
        }
      }
      document.getElementById("logoutBtn")?.addEventListener('click', () => signOut());
      return;
    }
    
    // User Dashboard with Tabs
    const earnContent = renderEarnTab();
    const newsContent = renderNewsTab();
    const cryptoContent = renderCryptoTab();
    const dataContent = renderDataTab();
    const ussdContent = renderUSSBTab();
    const triviaContent = renderTriviaTab();
    const careContent = renderCareTab();
    
    app.innerHTML = `
      <div class="nav-tabs">
        <button class="tab-btn ${currentTab === 'earn' ? 'active' : ''}" data-tab="earn">💰 Earn</button>
        <button class="tab-btn ${currentTab === 'news' ? 'active' : ''}" data-tab="news">📰 News</button>
        <button class="tab-btn ${currentTab === 'crypto' ? 'active' : ''}" data-tab="crypto">📈 Crypto</button>
        <button class="tab-btn ${currentTab === 'data' ? 'active' : ''}" data-tab="data">📱 Data</button>
        <button class="tab-btn ${currentTab === 'ussd' ? 'active' : ''}" data-tab="ussd">🏦 USSD</button>
        <button class="tab-btn ${currentTab === 'trivia' ? 'active' : ''}" data-tab="trivia">🎮 Trivia</button>
        <button class="tab-btn ${currentTab === 'care' ? 'active' : ''}" data-tab="care">📞 Care</button>
      </div>
      
      <div id="tabContent">
        ${currentTab === 'earn' ? earnContent :
          currentTab === 'news' ? newsContent :
          currentTab === 'crypto' ? cryptoContent :
          currentTab === 'data' ? dataContent :
          currentTab === 'ussd' ? ussdContent :
          currentTab === 'trivia' ? triviaContent : careContent}
      </div>
    `;
    
    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        currentTab = e.target.dataset.tab;
        if (currentTab === 'trivia') { currentTriviaIndex = 0; triviaScore = 0; }
        renderApp();
      });
    });
    
    // Earn tab event listeners
    if (currentTab === 'earn') {
      updateTimerDisplay();
      document.getElementById("dailyBtn")?.addEventListener('click', () => claimDaily());
      document.getElementById("watchAdBtn")?.addEventListener('click', () => watchAd());
      document.getElementById("smartLinkBtn")?.addEventListener('click', () => openSmartLink());
      document.getElementById("savePaymentBtn")?.addEventListener('click', () => savePaymentDetails());
      document.getElementById("withdrawBtn")?.addEventListener('click', () => requestWithdrawal());
      document.getElementById("logoutBtn")?.addEventListener('click', () => signOut());
      
      document.querySelectorAll('.platform-card').forEach(card => {
        card.addEventListener('click', () => { const url = card.dataset.url; if(url) openUrl(url); });
      });
      document.querySelectorAll('.quick-chip').forEach(chip => {
        chip.addEventListener('click', () => { const url = chip.dataset.url; if(url) openUrl(url); });
      });
      document.getElementById('goUrlBtn')?.addEventListener('click', () => {
        const url = document.getElementById('customUrlInput')?.value;
        if(url) openUrl(url);
      });
    }
    
    // USSD tab - copy codes
    if (currentTab === 'ussd') {
      document.querySelectorAll('.opportunity-card').forEach(card => {
        card.addEventListener('click', () => {
          const code = card.dataset.copy;
          if (code) copyToClipboard(code);
        });
      });
    }
    
    // Customer Care tab - call numbers
    if (currentTab === 'care') {
      document.querySelectorAll('.platform-card[data-number]').forEach(card => {
        card.addEventListener('click', () => {
          const number = card.dataset.number;
          window.location.href = `tel:${number}`;
        });
      });
    }
    
    // Trivia tab
    if (currentTab === 'trivia') {
      document.querySelectorAll('.trivia-option').forEach(opt => {
        opt.addEventListener('click', async () => {
          const selected = parseInt(opt.dataset.optIndex);
          const correct = parseInt(opt.dataset.correct);
          const reward = parseInt(opt.dataset.reward);
          
          if (selected === correct) {
            opt.classList.add('correct');
            await completeTrivia(reward);
            triviaScore++;
            currentTriviaIndex++;
            if (currentTriviaIndex < triviaQuestions.length) {
              renderApp();
            } else {
              showToast(`🎉 Trivia complete! ${triviaScore}/${triviaQuestions.length} correct!`, 4000);
              currentTriviaIndex = 0;
              triviaScore = 0;
              renderApp();
            }
          } else {
            opt.classList.add('wrong');
            showToast("❌ Wrong answer! Try the next question.", 2000);
            currentTriviaIndex++;
            if (currentTriviaIndex < triviaQuestions.length) {
              setTimeout(() => renderApp(), 1500);
            }
          }
        });
      });
    }
  }
  
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      isAdmin = (user.email === ADMIN_EMAIL);
      await loadUserData();
      renderApp();
    } else {
      renderApp();
    }
  });
</script>
