  async function canWatchAd() {
    if (!currentUser) return false;
    const lastAd = userData?.lastAdTime;
    if (!lastAd) return true;
    const lastAdDate = lastAd.toDate ? lastAd.toDate() : new Date(lastAd);
    const hoursSince = (Date.now() - lastAdDate.getTime()) / (1000 * 60 * 60);
    return hoursSince >= AD_COOLDOWN_HOURS;
  }

  async function watchAd() {
    if (!currentUser) return alert("Login first");
    const canWatch = await canWatchAd();
    if (!canWatch) return alert("Wait 4 hours before another ad");

    setTimeout(async () => {
      await db.collection('users').doc(currentUser.uid).update({
        lastAdTime: new Date(),
        points: firebase.firestore.FieldValue.increment(AD_REWARD_POINTS),
        totalPoints: firebase.firestore.FieldValue.increment(AD_REWARD_POINTS),
        adsWatched: firebase.firestore.FieldValue.increment(1)

      renderApp();
      showToast(`🎉 +${AD_REWARD_POINTS} points!`, 3000);

  async function claimDaily() {
    if (!currentUser) return;
    const today = new Date().toISOString().split('T')[0];
    const claimRef = db.collection('users').doc(currentUser.uid).collection('dailyClaims').doc(today);
    if ((await claimRef.get()).exists) return alert("Already claimed today!");
    
    let streak = (userData?.streak || 0) + 1;
    let reward = DAILY_REWARD;
    if (streak >= 30) reward = 100;
    else if (streak >= 14) reward = 50;
    else if (streak >= 7) reward = 25;
    else if (streak >= 3) reward = 10;
    
    await claimRef.set({ date: today });
    await db.collection('users').doc(currentUser.uid).update({
      points: firebase.firestore.FieldValue.increment(reward),
      totalPoints: firebase.firestore.FieldValue.increment(reward),
      streak: streak
    });
    await loadUserData();
    showToast(`🎉 +${reward} points! ${streak} day streak!`, 3000);
    renderApp();
  }

      totalPoints: firebase.firestore.FieldValue.increment(reward),

      <div class="section-title">🤖 AI Tools for Work & Creativity</div>
      <div class="grid-2">
        ${opportunities.aiTools.map(tool => `
          <div class="card" data-url="${tool.url}">
            <div style="font-size:1.5rem;">${tool.icon}</div>
            <div><strong>${tool.name}</strong></div>
            <div class="info">${tool.use}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderEarnTab() {
    const points = userData?.points || 0;
    const cashValue = (points / POINTS_FOR_5_DOLLARS) * 5;
    const canWatch = canWatchAd();
    
    return `
      <div class="balance">
        <h2>${points} pts</h2>
        <div>≈ $${cashValue.toFixed(2)} USD</div>
      </div>
      
      <button id="watchAdBtn" class="btn-ad">🎥 Watch Ad (+${AD_REWARD_POINTS} pts)</button>
      <button id="dailyBtn" class="btn-primary">📅 Daily Check-in</button>
      <button id="smartLinkBtn" class="btn-outline">💰 Special Offers (+1 pt)</button>
      
      <div class="section-title">💳 Withdrawal Details</div>
      <input type="text" id="bankName" placeholder="Bank" value="${userData?.paymentDetails?.bank || ''}">
      <input type="text" id="accountNumber" placeholder="Account number" value="${userData?.paymentDetails?.account || ''}">
      <input type="text" id="accountName" placeholder="Full name" value="${userData?.paymentDetails?.name || ''}">
      <button id="savePaymentBtn" class="btn-outline">Save Details</button>
      <button id="withdrawBtn" class="btn-withdraw" ${points < POINTS_FOR_5_DOLLARS ? 'disabled' : ''}>
        ${points >= POINTS_FOR_5_DOLLARS ? `💰 Withdraw $${cashValue.toFixed(2)}` : `🔒 Need ${POINTS_FOR_5_DOLLARS - points} points`}
      </button>
    `;
  }

  // ============================================================
  // MAIN RENDER
  // ============================================================
  async function renderApp() {
    const app = document.getElementById("app");
    
    if (!currentUser) {
      app.innerHTML = `
        <h1>💰 CentLock Hub</h1>
        <div class="info">Earn, Learn, Track Crypto, Find Opportunities & More!</div>
        <div class="balance"><h2>Welcome!</h2></div>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPass" placeholder="Password">
        <button id="loginBtn" class="btn-primary">Login</button>
        <hr>
        <input type="email" id="regEmail" placeholder="Email">
        <input type="text" id="regUser" placeholder="Username">
        <input type="password" id="regPass" placeholder="Password (min 6)">
        <button id="registerBtn" class="btn-outline">Sign Up (+10 pts)</button>
      `;
      document.getElementById("loginBtn")?.addEventListener('click', () => {
        signIn(document.getElementById("loginEmail").value, document.getElementById("loginPass").value);
      });
      document.getElementById("registerBtn")?.addEventListener('click', async () => {
        const pwd = document.getElementById("regPass").value;
        if (pwd.length < 6) return alert("Min 6 characters");
        await signUp(document.getElementById("regEmail").value, pwd, document.getElementById("regUser").value);
      });
      return;
    }
    
    if (isAdmin) {
      app.innerHTML = `<h1>👑 Admin</h1><button id="logoutBtn" class="btn-outline">Logout</button>`;
      document.getElementById("logoutBtn")?.addEventListener('click', () => signOut());
      return;
    }
    
    app.innerHTML = `
      <div class="flex"><h1>CentLock Hub</h1><div class="info">👋 ${userData?.username}</div></div>
      
      <div class="nav-tabs">
        <button class="tab-btn ${currentTab === 'opportunities' ? 'active' : ''}" data-tab="opportunities">🎯 Opps</button>
        <button class="tab-btn ${currentTab === 'news' ? 'active' : ''}" data-tab="news">📰 News</button>
        <button class="tab-btn ${currentTab === 'crypto' ? 'active' : ''}" data-tab="crypto">📈 Crypto</button>
        <button class="tab-btn ${currentTab === 'data' ? 'active' : ''}" data-tab="data">📱 Data</button>
        <button class="tab-btn ${currentTab === 'ussd' ? 'active' : ''}" data-tab="ussd">🏦 USSD</button>
        <button class="tab-btn ${currentTab === 'trivia' ? 'active' : ''}" data-tab="trivia">🎮 Trivia</button>
        <button class="tab-btn ${currentTab === 'care' ? 'active' : ''}" data-tab="care">📞 Care</button>
        <button class="tab-btn ${currentTab === 'learning' ? 'active' : ''}" data-tab="learning">📚 Learn</button>
        <button class="tab-btn ${currentTab === 'ai' ? 'active' : ''}" data-tab="ai">🤖 AI</button>
        <button class="tab-btn ${currentTab === 'earn' ? 'active' : ''}" data-tab="earn">💰 Earn</button>
      </div>
      
      <div id="tabContent">
        ${currentTab === 'opportunities' ? renderOpportunities() :
          currentTab === 'news' ? renderNewsFeed() :
          currentTab === 'crypto' ? renderCryptoPrices() :
          currentTab === 'data' ? renderDataPlans() :
          currentTab === 'ussd' ? renderBankCodes() :
          currentTab === 'trivia' ? renderTrivia() :
          currentTab === 'care' ? renderCustomerCare() :
          currentTab === 'learning' ? renderLearningHub() :
          currentTab === 'ai' ? renderAIToolbox() : renderEarnTab()}
      </div>
    `;
    
    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        currentTab = e.target.dataset.tab;
        if (currentTab === 'trivia') { currentTriviaIndex = 0; triviaScore = 0; }
        renderApp();
      });
    });
    
    // Opportunities tab events
    if (currentTab === 'opportunities') {
      document.getElementById("quickEarnBtn")?.addEventListener('click', () => { currentTab = "earn"; renderApp(); });
      document.getElementById("quickDailyBtn")?.addEventListener('click', () => claimDaily());
      document.querySelectorAll('[data-url]').forEach(el => {
        el.addEventListener('click', () => openUrl(el.dataset.url));
      });
    }
    
    // USSD tab - copy codes
    if (currentTab === 'ussd') {
      document.querySelectorAll('.opportunity-card').forEach(card => {
        card.addEventListener('click', () => {
          const code = card.dataset.copy;
          if (code) copyToClipboard(code);
        });
      });
    }
    
    // Customer Care tab - call numbers
    if (currentTab === 'care') {
      document.querySelectorAll('.card[data-number]').forEach(card => {
        card.addEventListener('click', () => {
          const number = card.dataset.number;
          window.location.href = `tel:${number}`;
        });
      });
    }
    
    // Trivia tab
    if (currentTab === 'trivia') {
      document.querySelectorAll('.trivia-option').forEach(opt => {
        opt.addEventListener('click', async () => {
          const selected = parseInt(opt.dataset.optIndex);
          const correct = parseInt(opt.dataset.correct);
          const reward = parseInt(opt.dataset.reward);
          
          if (selected === correct) {
            opt.classList.add('correct');
            await completeTrivia(reward);
            triviaScore++;
            currentTriviaIndex++;
            if (currentTriviaIndex < triviaQuestions.length) {
              renderApp();
            } else {
              showToast(`🎉 Trivia complete! ${triviaScore}/${triviaQuestions.length} correct!`, 4000);
              currentTriviaIndex = 0;
              triviaScore = 0;
              renderApp();
            }
          } else {
            opt.classList.add('wrong');
            showToast("❌ Wrong answer! Try the next question.", 2000);
            currentTriviaIndex++;
            if (currentTriviaIndex < triviaQuestions.length) {
              setTimeout(() => renderApp(), 1500);
            }
          }
        });
      });
    }
    
    // Learning tab
    if (currentTab === 'learning') {
      document.querySelectorAll('.complete-lesson').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          const reward = parseInt(btn.dataset.reward);
          completeLesson(id, reward);
        });
      });
    }
    
    // AI tab
    if (currentTab === 'ai') {
      document.querySelectorAll('.card[data-url]').forEach(card => {
        card.addEventListener('click', () => openUrl(card.dataset.url));
      });
    }
    
    // Earn tab
    if (currentTab === 'earn') {
      document.getElementById("watchAdBtn")?.addEventListener('click', () => watchAd());
      document.getElementById("dailyBtn")?.addEventListener('click', () => claimDaily());
      document.getElementById("smartLinkBtn")?.addEventListener('click', async () => {
        window.open(SMARTLINK_URL, '_blank');
        await db.collection('users').doc(currentUser.uid).update({ points: firebase.firestore.FieldValue.increment(1) });
        await loadUserData();
        showToast("+1 point!", 2000);
        renderApp();
      });
      document.getElementById("savePaymentBtn")?.addEventListener('click', async () => {
        const bank = document.getElementById('bankName')?.value;
        const account = document.getElementById('accountNumber')?.value;
        const name = document.getElementById('accountName')?.value;
        if (bank && account && name) {
          await db.collection('users').doc(currentUser.uid).update({ paymentDetails: { bank, account, name } });
          alert("Payment details saved!");
        }
      });
      document.getElementById("withdrawBtn")?.addEventListener('click', async () => {
        if ((userData?.points || 0) >= POINTS_FOR_5_DOLLARS) {
          const amount = (userData.points / POINTS_FOR_5_DOLLARS) * 5;
          await db.collection('withdrawalRequests').add({
            userId: currentUser.uid, username: userData.username,
            points: userData.points, amount: amount,
            paymentDetails: userData.paymentDetails, status: "pending", date: new Date()
          });
          alert(`Withdrawal request for $${amount.toFixed(2)} submitted!`);
        }
      });
    }
  }
  
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      isAdmin = (user.email === ADMIN_EMAIL);
      await loadUserData();
      renderApp();
    } else {
      renderApp();
    }
  });
</script>
</body>
</html>
